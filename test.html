<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小全科測驗系統 (清晰題號版)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #d35400;
            --subj-sci: #27ae60;
            --subj-eng: #8e44ad;
            --subj-soc: #c0392b;
            --subj-math: #2980b9;
            --subj-chi: #e67e22;
            --bg: #f0f3f6;
            --card: #ffffff;
            --wrong: #e74c3c;
            --correct: #27ae60;
            --radius: 12px;
        }

        body {
            font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
            background: var(--bg);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 950px;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* Header */
        .header {
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .title h1 {
            margin: 0;
            color: var(--secondary);
            font-size: 1.8em;
        }

        .title p {
            margin: 5px 0 0;
            color: #7f8c8d;
        }

        /* Controls */
        .control-group {
            margin-top: 15px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .subj-btn {
            flex: 1;
            min-width: 90px;
            padding: 10px;
            border: 2px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            transition: all 0.2s;
            font-size: 1.05rem;
        }

        .subj-btn[data-type="science"].active {
            background: var(--subj-sci);
            color: white;
            border-color: var(--subj-sci);
        }

        .subj-btn[data-type="english"].active {
            background: var(--subj-eng);
            color: white;
            border-color: var(--subj-eng);
        }

        .subj-btn[data-type="social"].active {
            background: var(--subj-soc);
            color: white;
            border-color: var(--subj-soc);
        }

        .subj-btn[data-type="math"].active {
            background: var(--subj-math);
            color: white;
            border-color: var(--subj-math);
        }

        .subj-btn[data-type="chinese"].active {
            background: var(--subj-chi);
            color: white;
            border-color: var(--subj-chi);
        }

        .grade-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #7f8c8d;
            transition: all 0.2s;
        }

        .grade-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-reset {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            margin-left: auto;
        }

        .btn-reset:hover {
            background: #ba4a00;
        }

        /* Quiz UI */
        .page {
            display: none;
            animation: fadeIn 0.3s;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sec-title {
            background: var(--secondary);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            display: inline-block;
            margin: 25px 0 15px 0;
            font-weight: bold;
            font-size: 1.1em;
        }

        .card {
            background: #fff;
            border: 2px solid #eef2f5;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        /* Reading Article Style */
        .article-box {
            background: #fff8e1;
            border: left 5px solid #f1c40f;
            background: #fcf8e3;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            line-height: 1.8;
            font-size: 1.05rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .article-title {
            font-weight: bold;
            font-size: 1.3em;
            color: #d35400;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px dashed #d35400;
            padding-bottom: 10px;
        }

        .article-content {
            color: #2c3e50;
            text-align: left;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .tag {
            font-size: 0.85em;
            background: #e8f6f3;
            color: #16a085;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        /* ★ 新版題號樣式 ★ */
        .q-label {
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95em;
            white-space: nowrap;
        }

        .q-txt {
            font-size: 1.4em;
            font-weight: 600;
            color: #2c3e50;
            line-height: 1.5;
            margin-bottom: 20px;
            display: block;
        }

        /* Inputs */
        .opts {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .opt-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            color: #555;
            transition: 0.1s;
            font-size: 1.1em;
        }

        .opt-btn:hover {
            border-color: var(--primary);
            background: #f4f8fb;
        }

        .opt-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .fill-input {
            width: 100%;
            max-width: 350px;
            padding: 12px 15px;
            font-size: 1.2em;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            color: #333;
            background: #fafafa;
        }

        .fill-input:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .fill-multi {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .fill-part {
            min-width: 80px;
            width: auto;
        }
        .fill-space {
            color: #aaa;
            font-size: 0.8em;
            user-select: none;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 14px;
            padding: 32px 28px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            text-align: center;
        }
        .modal-box h3 { margin: 0 0 10px; color: var(--primary); font-size: 1.3em; }
        .modal-box p { color: #555; margin: 0 0 22px; line-height: 1.6; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .modal-btns button {
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-btns button:hover { opacity: 0.85; }
        .btn-restart-full { background: var(--accent); color: #fff; }
        .btn-restart-wrong { background: var(--primary); color: #fff; }
        .btn-cancel-modal { background: #eee; color: #555; }

        /* History panel */
        .history-toggle {
            background: none;
            border: 1px solid #bbb;
            color: #666;
            border-radius: 6px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.9em;
            margin-left: auto;
        }
        .history-panel {
            display: none;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-top: 12px;
            max-height: 320px;
            overflow-y: auto;
        }
        .history-panel.open { display: block; }
        .history-record {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            font-size: 0.95em;
            color: #444;
        }
        .history-record:last-child { border-bottom: none; }
        .history-score { font-weight: bold; font-size: 1.1em; color: var(--primary); }
        .history-meta { color: #888; font-size: 0.85em; margin-bottom: 4px; }
        .history-wrongs { color: var(--wrong); font-size: 0.88em; margin-top: 4px; }
        .wrong-bank-info {
            background: #fff3e0;
            border: 1px solid #ffcc80;
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 0.95em;
            color: #e65100;
        }

        /* Inline history on home */
        .inline-history {
            margin-top: 12px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .inline-history-title {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.82em;
            color: #999;
            margin-bottom: 4px;
            letter-spacing: 0.03em;
        }
        .inline-history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .inline-history-item {
            font-size: 0.82em;
            color: #555;
            background: #f5f5f5;
            border-radius: 5px;
            padding: 3px 9px;
            white-space: nowrap;
        }
        .inline-history-item.high { color: var(--correct); font-weight: bold; }
        .inline-history-item.low  { color: var(--wrong); }

        /* Report & Nav */
        .report {
            display: none;
        }

        .score-box {
            text-align: center;
            background: #fff;
            border: 3px solid var(--primary);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .score {
            font-size: 4em;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }

        .review-item {
            border: 1px solid #eee;
            border-left: 5px solid var(--wrong);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #fffbfb;
        }

        .review-correct {
            border-left-color: var(--correct);
            background-color: #f4fff6;
        }

        .review-wrong {
            border-left-color: var(--wrong);
            background-color: #fffbfb;
        }

        .ans-row {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            font-weight: bold;
            font-size: 1.1em;
        }

        .my-ans {
            color: var(--wrong);
            text-decoration: line-through;
        }

        .real-ans {
            color: var(--correct);
        }

        .google-link {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 10px;
            font-size: 0.82em;
            font-weight: normal;
            color: #4285f4;
            text-decoration: none;
            border: 1px solid #4285f4;
            border-radius: 4px;
            padding: 1px 7px;
            vertical-align: middle;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .google-link:hover { background: #e8f0fe; }

        .exp {
            background: #fff;
            padding: 12px;
            font-size: 1em;
            border: 1px solid #eee;
            border-radius: 6px;
            color: #666;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .btn-nav {
            padding: 12px 35px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            background: #95a5a6;
            font-size: 1em;
        }

        .btn-nav.active {
            background: var(--primary);
        }

        .btn-nav.submit {
            background: var(--wrong);
        }

        .btn-nav:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .btn-row {
                flex-direction: column;
            }

            .btn-reset {
                width: 100%;
                margin-top: 10px;
            }

            .card-header {
                flex-wrap: wrap;
            }
        }

        /* 配合題 drag-drop styles */
        /* 聽力測驗 styles */

        .wrongchar-card { border-left: 4px solid #8b5cf6; }
        .wrongchar-sentence { line-height: 3; letter-spacing: 0.05em; margin: 12px 0; font-size: 1.1em; }
        .wc-char { display: inline-block; cursor: pointer; padding: 1px 2px; border-radius: 3px; transition: background 0.15s, color 0.15s; }
        .wc-char:hover { background: #ede9fe; }
        .wc-char.selected { background: #fde8e8; color: #c0392b; font-weight: bold; text-decoration: underline wavy #c0392b; }
        .wc-char.correct-wrong { background: #dcfce7; color: #166534; }
        .wc-char.wrong-miss { background: #fef9c3; color: #854d0e; }
        .wrongchar-hint { color: #888; font-size: 0.88em; margin-top: 4px; }
        .wrongchar-hint .wc-sel-count { font-weight: bold; color: #8b5cf6; }
        .listen-card { border-left: 4px solid #f59e0b; }
        .listen-play { margin: 10px 0; }
        .listen-btn { background: #f59e0b; color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 1em; cursor: pointer; transition: background 0.2s; }
        .listen-btn:hover { background: #d97706; }

        .matching-container { display: flex; flex-direction: column; gap: 16px; }
        .matching-terms { display: flex; flex-direction: column; gap: 10px; }
        .match-row { display: flex; align-items: center; gap: 10px; background: var(--card, #fff); border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); flex-wrap: wrap; }
        .match-term { font-weight: 700; font-size: 1.05em; color: var(--accent, #d35400); min-width: 120px; flex-shrink: 0; }
        .match-drop { min-width: 180px; min-height: 40px; border: 2px dashed #aaa; border-radius: 8px; padding: 6px 12px; color: #888; font-size: 0.95em; flex: 1; transition: border-color 0.2s, background 0.2s; cursor: default; }
        .match-drop.drag-over { border-color: #4f8ef7; background: #e8f0ff; }
        .match-drop.filled { border-style: solid; border-color: #4f8ef7; color: #222; background: #f0f5ff; cursor: pointer; }
        .match-drop.filled::after { content: " ✕"; font-size: 0.8em; color: #999; }
        .match-drop.correct { border-color: #22c55e; background: #dcfce7; color: #166534; cursor: default; }
        .match-drop.correct::after { content: ""; }
        .match-drop.wrong { border-color: #ef4444; background: #fee2e2; color: #991b1b; cursor: default; }
        .match-drop.wrong::after { content: ""; }
        .matching-answers { background: var(--card, #fff); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); position: sticky; top: 60px; z-index: 10; margin-bottom: 12px; }
        .match-answers-title { text-align: center; color: #555; font-size: 0.9em; margin-bottom: 12px; }
        .match-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .match-chip { background: var(--subj-soc, #c0392b); color: #fff; border-radius: 20px; padding: 8px 16px; cursor: grab; font-size: 0.95em; user-select: none; transition: opacity 0.2s, transform 0.15s; box-shadow: 0 2px 6px rgba(192,57,43,0.3); }
        .match-chip:active { cursor: grabbing; transform: scale(1.05); }
        .match-chip.used { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="title">
                <h1>國小全科測驗系統</h1>
                <p>清晰題號版 | 四科整合 | 40題滿載</p>
            </div>

            <div class="control-group">
                <div class="btn-row">
                    <button class="subj-btn active" data-type="chinese"
                        onclick="setSubject('chinese', this)">國語</button>
                    <button class="subj-btn" data-type="science" onclick="setSubject('science', this)">自然</button>
                    <button class="subj-btn" data-type="english" onclick="setSubject('english', this)">英文</button>
                    <button class="subj-btn" data-type="social" onclick="setSubject('social', this)">社會</button>
                    <button class="subj-btn" data-type="math" onclick="setSubject('math', this)">數學</button>
                </div>
            </div>

            <div class="control-group">
                <div class="btn-row">
                    <button class="grade-btn active" onclick="setGrade(0, this)">四年級上</button>
                    <button class="grade-btn" onclick="setGrade(1, this)">四年級下</button>
                    <button class="grade-btn" onclick="setGrade(2, this)">五年級上</button>
                    <button class="grade-btn" onclick="setGrade(3, this)">五年級下</button>
                    <button class="btn-reset" onclick="openRestartModal()">↻ 重新出題</button>
                </div>
            </div>
            <div class="inline-history" id="inline-history">
                <div class="inline-history-title">考試紀錄 <button onclick="clearHistory()" title="清空紀錄" style="background:none;border:none;cursor:pointer;font-size:1em;padding:0 4px;line-height:1;">❌</button></div>
                <div class="inline-history-list" id="inline-history-list"></div>
            </div>
        </div>

        <div id="quiz-container"></div>

        <div class="nav" id="nav-bar">
            <button id="btn-prev" class="btn-nav" onclick="changePage(-1)" disabled>上一頁</button>
            <button id="btn-next" class="btn-nav active" onclick="changePage(1)">下一頁</button>
            <button id="btn-submit" class="btn-nav submit" onclick="submitQuiz()" style="display:none">交卷計分</button>
        </div>

        <!-- Restart modal -->
        <div class="modal-overlay" id="restart-modal">
            <div class="modal-box">
                <h3>重新出題</h3>
                <p id="modal-desc">請選擇出題方式：</p>
                <div class="modal-btns">
                    <button class="btn-restart-full" onclick="doRestart(false)">全新出題</button>
                    <button class="btn-restart-wrong" id="btn-with-wrong" onclick="doRestart(true)">加入答錯題目</button>
                    <button class="btn-cancel-modal" onclick="closeModal()">取消</button>
                </div>
            </div>
        </div>

        <div id="report" class="report">
            <div class="score-box">
                <h2>測驗成績</h2>
                <div class="score" id="score-text">--</div>
                <div id="score-msg">--</div>
                <div id="score-datetime" style="color:#888;font-size:0.9em;margin-top:6px;"></div>
            </div>
            <div id="wrong-bank-banner" class="wrong-bank-info" style="display:none;"></div>
            <div style="margin-bottom:10px;"><strong>答題詳解</strong></div>
            <div id="error-list"></div>
            <button class="btn-nav active" style="margin:20px auto; display:block;" onclick="openRestartModal()">再測一次</button>
        </div>
    </div>

    <script>
        // --------------------------------------------------------
        // 1. 靜態資料庫 (自然 / 英文 / 社會)
        // --------------------------------------------------------
        // 4年級上學期 (月亮、水生植物、運輸工具)
        // 4年級上學期 (月亮、水生植物、運輸工具)
        const SRC_SCI_G4_A = {
            backup_fill: [
                { q: "月亮本身會發光嗎?", a: "不會", o: ["不會", "會", "只有滿月會", "晚上會"], exp: "月亮反射太陽光。", tag: "天文" },
                { q: "下列哪種植物是漂浮性水生植物?", a: "布袋蓮", o: ["布袋蓮", "荷花", "水蘊草", "睡蓮"], exp: "布袋蓮漂浮在水面。", tag: "生物" },
                { q: "觀測月亮依農曆日期，初一的月相稱為什麼?", a: "朔", o: ["朔", "望", "上弦月", "下弦月"], exp: "初一月亮不可見。", tag: "天文" },
                { q: "車輪的紋路主要為了?", a: "增加摩擦力", o: ["增加摩擦力", "減少摩擦力", "美觀", "標示"], exp: "防滑。", tag: "物理" },
                { q: "植物的根主要功能是吸收什麼?", a: "水分", o: ["水分", "陽光", "空氣", "葉綠素"], exp: "根負責吸收水分與礦物質。", tag: "生物" },
                { q: "下列何者能溶於水?", a: "糖", o: ["糖", "沙子", "油", "鐵釘"], exp: "溶解性。", tag: "化學" },

                { q: "廢電池若隨意丟棄可能造成什麼影響?", a: "汙染土壤和地下水", o: ["汙染土壤和地下水", "讓植物長更快", "什麼都不會", "讓空氣更清新"], exp: "廢電池含有重金屬，若隨意丟棄會汙染土壤和地下水。", tag: "電路" },
                { q: "岩石在自然界中主要用途是?", a: "雕刻建材", o: ["雕刻建材", "種植植物", "作緩衝材料", "做砂漏"], exp: "岩石堅硬，可用來雕刻成像或製作建築材料。", tag: "岩石土壤" },
                { q: "跳遠時，沙坑緩衝受力的原因是?", a: "沙顆粒不黏而鬆散", o: ["沙顆粒不黏而鬆散", "沙很重", "沙很硬", "沙有彈性"], exp: "沙顆粒鬆散，可以分散衝擊力，提供緩衝效果。", tag: "岩石土壤" },
                { q: "開墾山坡地卻沒有做好水土保持，容易造成什麼問題?", a: "土石流或坍方", o: ["土石流或坍方", "地震", "海嘯", "暴風雨"], exp: "山坡地開墾後植被減少，遇大雨容易造成土石流。", tag: "岩石土壤" },
                { q: "能量可以讓物體運作或改變，下列哪一個特性錯誤?", a: "能量有重量可以秤出來", o: ["能量有重量可以秤出來", "能量看不見", "能量摸不到", "能量可以互相轉換"], exp: "能量是無形的，無法直接秤量，但可以改變物體狀態。", tag: "能量" },
                { q: "超音波可以應用在醫學上，用來做什麼?", a: "震碎結石", o: ["震碎結石", "照X光", "輸血", "量血壓"], exp: "醫學上利用超音波（聲能）的振動，可以震碎腎結石。", tag: "能量" },
                { q: "液化石油氣（瓦斯）是屬於哪一種能源?", a: "燃料（非再生能源）", o: ["燃料（非再生能源）", "再生能源", "風力能源", "太陽能源"], exp: "液化石油氣是化石燃料提煉而成，屬非再生能源。", tag: "能量" },
                { q: "台灣目前最主要的發電方式是?", a: "火力發電", o: ["火力發電", "水力發電", "風力發電", "太陽能發電"], exp: "台灣目前主要靠燃燒化石燃料（天然氣、煤）的火力發電。", tag: "能量" },
                { q: "蠶吐絲結繭所製成的絲，是取自哪種自然資源?", a: "生物資源（動物）", o: ["生物資源（動物）", "非生物資源", "礦物資源", "水資源"], exp: "蠶絲來自蠶（動物），屬於生物資源。", tag: "自然資源" },
                { q: "石油可以製成下列哪些物品?", a: "雨衣和保特瓶", o: ["雨衣和保特瓶", "木製桌椅", "鐵製鍋具", "棉質衣服"], exp: "石油可以提煉出塑膠，製成雨衣、保特瓶等製品。", tag: "自然資源" },
                { q: "下列哪種行為可以保護自然資源?", a: "合理捕撈、避免過度採集", o: ["合理捕撈、避免過度採集", "大量伐木蓋房子", "超抽地下水灌溉", "隨意丟棄廢電池"], exp: "有計畫地使用自然資源，才能讓資源永續利用。", tag: "自然資源" },
                { q: "葉脩的身體形狀像葉子，這種隱蔽方式的功用是?", a: "避免被天敵發現", o: ["避免被天敵發現", "吸引異性", "便於飛行", "增加速度"], exp: "葉脩利用外形偽裝，隱藏在環境中保護自己。", tag: "昆蟲" },
            ],
            backup_word: [
                { q: "完全變態和不完全變態的主要差別是什麼?", a: "完全變態有蛹期，不完全變態沒有蛹期", o: ["完全變態有蛹期，不完全變態沒有蛹期", "完全變態無幼蟲期", "兩者都有蛹期", "不完全變態比較多階段"], exp: "完全變態有卵幼蛹成四階段；不完全變態只有卵若蟲成三階段，無蛹期。", tag: "昆蟲" },
                { q: "昆蟲身體分頭、胸、腹三部分，翅膀和腳都長在哪裡?", a: "胸部", o: ["胸部", "腹部", "頭部", "都有"], exp: "昆蟲的翅膀和三對腳都長在胸部。", tag: "昆蟲" },
                { q: "電路中，電流可以流通的狀態叫做什麼?", a: "通路", o: ["通路", "斷路", "短路", "阻路"], exp: "通路是電流能從電源出發，通過導線和負載，回到電源的完整迴路。", tag: "電路" },
                { q: "電池串聯和並聯有何不同？哪種接法讓燈泡更亮?", a: "串聯讓燈泡更亮", o: ["串聯讓燈泡更亮", "並聯讓燈泡更亮", "兩種一樣亮", "都會燒壞燈泡"], exp: "串聯電壓較高，燈泡較亮；並聯電壓不變，但使用時間較長。", tag: "電路" },
                { q: "客廳6顆吊燈，其中1顆壞掉，其他5顆繼續亮，這6顆燈泡是串聯還是並聯?", a: "並聯", o: ["並聯", "串聯", "無法判斷", "混合接法"], exp: "並聯電路中各支路獨立，一顆壞掉不影響其他支路。", tag: "電路" },
                { q: "岩石、沙和土壤加水後各有何不同? 沙加水後的特性是?", a: "不黏，無法塑形", o: ["不黏，無法塑形", "很黏，可以塑形", "完全吸水消失", "變成石頭"], exp: "沙顆粒圓滑，加水後不黏，不能揉成形狀；土壤才有黏性。", tag: "岩石土壤" },
                { q: "山上持續下大雨，可能發生什麼災害? 請選出正確的可能情況。", a: "山坡出現土石流，山路有泥土砂石", o: ["山坡出現土石流，山路有泥土砂石", "河水變清澈，環境更好", "地層上升，山更高", "沒有任何影響"], exp: "大雨侵蝕土地，鬆動土石，容易引發土石流。", tag: "岩石土壤" },
                { q: "能量是看不見、摸不到的，電鍋使用時，電能轉換成什麼能量?", a: "熱能", o: ["熱能", "光能", "聲能", "動能"], exp: "電鍋將電能轉換成熱能，加熱食物使其熟透。", tag: "能量" },
                { q: "太陽能和風力屬於再生能源，煤炭和石油屬於非再生能源。非再生能源的特點是?", a: "用一點少一點，無法短期補充", o: ["用一點少一點，無法短期補充", "可以無限使用", "越用越多", "比再生能源更環保"], exp: "非再生能源需要千萬年才能形成，耗盡後無法在短時間內補充。", tag: "能量" },
                { q: "生物資源和非生物資源有何不同? 木材屬於哪種資源?", a: "生物資源（來自植物）", o: ["生物資源（來自植物）", "非生物資源", "礦物資源", "化石燃料"], exp: "木材來自樹木（植物），屬於生物資源。", tag: "自然資源" },
                { q: "我們應該如何保護自然資源，讓它永續存在? 請選出正確做法。", a: "合理使用，減少浪費", o: ["合理使用，減少浪費", "能用多少就用多少", "不使用任何資源", "只使用非生物資源"], exp: "有計畫地使用，避免過度開採，才能讓自然資源永續。", tag: "自然資源" }
            ],
            tf: [
                { q: "昆蟲的身體分為頭、胸、腹三個部分。", a: "O", o: ["O","X"], exp: "昆蟲的三大體節：頭（感覺和攝食）、胸（運動）、腹（消化和生殖）。", tag: "昆蟲的身體構造" },
                { q: "昆蟲都有六條腿，而且六條腿都長在胸部。", a: "O", o: ["O","X"], exp: "昆蟲（六足綱）有三對腳，全部著生在胸部，這是鑑別昆蟲的重要特徵。", tag: "昆蟲的身體構造" },
                { q: "所有昆蟲都有翅膀，可以在空中飛行。", a: "X", o: ["O","X"], exp: "有些昆蟲沒有翅膀（如工蟻、書蝨），或翅膀已退化，並非所有昆蟲都能飛行。", tag: "昆蟲的身體構造" },
                { q: "昆蟲的觸角長在頭部，有感覺氣味和觸碰環境的功能。", a: "O", o: ["O","X"], exp: "觸角是昆蟲的感覺器官，主要位於頭部，能偵測氣味、振動和溫度等環境訊息。", tag: "昆蟲的身體構造" },
                { q: "蜘蛛是昆蟲的一種，因為牠身體很小，而且有腳。", a: "X", o: ["O","X"], exp: "蜘蛛有8條腿，身體分頭胸部和腹部兩節，屬於蜘蛛綱，不是昆蟲（昆蟲有6腿3節）。", tag: "昆蟲的身體構造" },
                { q: "昆蟲的複眼由許多小眼（小透鏡）組成，能同時感測廣大的視野範圍。", a: "O", o: ["O","X"], exp: "複眼是昆蟲眼睛的主要型態，由數百到數千個小眼組成，視野廣但解析度低。", tag: "昆蟲的身體構造" },
                { q: "蝗蟲的口器是刺吸式，用來刺穿植物後吸取汁液。", a: "X", o: ["O","X"], exp: "蝗蟲是咀嚼式口器，用來直接咬食固體植物葉片；蚊子才是刺吸式。", tag: "昆蟲的身體構造與功能" },
                { q: "蚊子的口器是刺吸式，能刺穿皮膚吸取血液。", a: "O", o: ["O","X"], exp: "蚊子的口器針狀，可刺穿皮膚，吸取血液或植物汁液。雄蚊只吸植物汁液，雌蚊才吸血。", tag: "昆蟲的身體構造與功能" },
                { q: "螳螂的前腿特化成鐮刀狀，是用來捕捉獵物的構造。", a: "O", o: ["O","X"], exp: "螳螂前腿高度特化，有倒刺，合攏時形如鐮刀，是捕食昆蟲的有力武器。", tag: "昆蟲的身體構造與功能" },
                { q: "蝗蟲的後腿特別粗壯，適合跳躍以逃避天敵。", a: "O", o: ["O","X"], exp: "蝗蟲後腿為跳躍腳，股節發達，能跳出自身體長數十倍的距離。", tag: "昆蟲的身體構造與功能" },
                { q: "蝴蝶的一生會經歷卵、幼蟲、蛹、成蟲四個階段，稱為完全變態。", a: "O", o: ["O","X"], exp: "蝴蝶是完全變態昆蟲的代表，幼蟲（毛毛蟲）和成蟲外形差異很大。", tag: "昆蟲的成長變化" },
                { q: "不完全變態昆蟲的幼期稱為「若蟲」，外形與成蟲大致相似，但翅膀未完全發育。", a: "O", o: ["O","X"], exp: "不完全變態（如蝗蟲、蟬、蟑螂）的若蟲漸漸接近成蟲外形，沒有蛹期。", tag: "昆蟲的成長變化" },
                { q: "蟬屬於完全變態昆蟲，其幼蟲稱為「蛹」。", a: "X", o: ["O","X"], exp: "蟬屬於不完全變態，幼期稱若蟲（在地底生活），羽化後成為成蟲，沒有蛹期。", tag: "昆蟲的成長變化" },
                { q: "蚊子屬於完全變態昆蟲，其幼蟲（孑孓）生活在水中。", a: "O", o: ["O","X"], exp: "蚊子的幼蟲（孑孓）在水中生活，經蛹期後羽化成成蟲，是完全變態昆蟲。", tag: "昆蟲的成長變化" },
                { q: "所有昆蟲的幼蟲和成蟲都生活在相同的環境中，吃相同的食物。", a: "X", o: ["O","X"], exp: "完全變態昆蟲的幼蟲和成蟲棲地和食性常完全不同，如蝴蝶幼蟲啃葉，成蟲吸花蜜。", tag: "昆蟲的成長變化" },
                { q: "蜜蜂採花蜜時順便替花朵傳粉，是植物有性生殖的重要幫手。", a: "O", o: ["O","X"], exp: "蜜蜂是重要的授粉昆蟲，若蜜蜂族群消失，許多植物將無法繁殖，影響生態系統。", tag: "小昆蟲大影響" },
                { q: "所有昆蟲對人類和環境都是有害的，應該全部消滅。", a: "X", o: ["O","X"], exp: "許多昆蟲對生態有益（如蜜蜂傳粉、螢火蟲為生態健康指標、瓢蟲吃蚜蟲）。", tag: "小昆蟲大影響" },
                { q: "螞蟻是社會性昆蟲，蟻群中的蟻后、工蟻和雄蟻各有不同分工。", a: "O", o: ["O","X"], exp: "螞蟻社會高度分工：蟻后負責產卵，工蟻負責覓食育幼，雄蟻負責與蟻后交配。", tag: "昆蟲界的王者" },
                { q: "台灣獨角仙是甲蟲的一種，屬於完全變態昆蟲，幼蟲（雞母蟲）生活在腐木中。", a: "O", o: ["O","X"], exp: "獨角仙（鍬形蟲科甲蟲）幼蟲以腐木為食，在腐木中化蛹，成蟲出來後以樹汁為食。", tag: "昆蟲界的王者" },
                { q: "能量有許多不同的形式，包括光能、熱能、動能、電能和化學能等。", a: "O", o: ["O","X"], exp: "能量形式多樣，並可透過轉換互相變換，如太陽能板將光能→電能。", tag: "不同型式的能量" },
                { q: "植物進行光合作用，將太陽的光能轉換成儲存在有機物中的化學能。", a: "O", o: ["O","X"], exp: "光合作用是能量轉換的典型例子：光能→化學能（有機物中的能量）。", tag: "不同型式的能量" },
                { q: "電燈發光時，只有電能轉換成光能，不會有任何能量浪費。", a: "X", o: ["O","X"], exp: "電燈發光的同時也產生熱能，並非所有電能都轉換成光能，有部分以熱能形式損失。", tag: "不同型式的能量" },
                { q: "煤炭、石油和天然氣都是化石燃料，是不可再生資源，用完就沒有了。", a: "O", o: ["O","X"], exp: "化石燃料需數億年形成，人類使用的速度遠超形成的速度，屬不可再生資源。", tag: "生活中的能源" },
                { q: "太陽能、風能和水力發電都是可再生能源，短時間內可以不斷補充。", a: "O", o: ["O","X"], exp: "可再生能源取之不盡，只要太陽照耀、風吹、水流就能持續使用。", tag: "生活中的能源" },
                { q: "燃燒化石燃料是造成全球暖化和空氣污染的重要原因之一。", a: "O", o: ["O","X"], exp: "燃燒化石燃料排放大量CO₂和污染物，加劇溫室效應和空氣污染。", tag: "開發自然資源會有什麼影響" },
                { q: "開採自然資源不會對環境造成任何影響。", a: "X", o: ["O","X"], exp: "開採礦產會破壞地表、污染水源；燃燒化石燃料會污染空氣，影響生態。", tag: "開發自然資源會有什麼影響" },
                { q: "地熱發電是利用地球內部的熱能轉換成電能，是可再生能源的一種。", a: "O", o: ["O","X"], exp: "地球內部持續產生熱能，地熱發電在地熱資源豐富的地區（如冰島、台灣部分地區）很實用。", tag: "生活中的能源" },
                { q: "食物中儲存的能量屬於化學能，被人體消化後轉換成熱能和動能維持生命活動。", a: "O", o: ["O","X"], exp: "食物中的有機物（化學能）在細胞中氧化分解，轉換成熱能和動能。", tag: "我們需要能量" },
                { q: "環保3R原則指的是「減量（Reduce）、重複使用（Reuse）、資源回收（Recycle）」。", a: "O", o: ["O","X"], exp: "3R是減少廢棄物、節約資源的核心原則，依重要性排序減量最優先。", tag: "環保行動" },
                { q: "節省能源是只有工廠和政府的責任，一般家庭不需要特別節約能源。", a: "X", o: ["O","X"], exp: "節能是每個人的責任，家庭、學校、企業都應共同努力減少能源消耗。", tag: "環保行動" },
                { q: "電動車完全沒有碳排放，是解決能源問題和空氣污染的完美方案。", a: "X", o: ["O","X"], exp: "若電動車的電力來自燃煤電廠，整體仍有碳排放；真正要配合再生電力才能接近零碳。", tag: "環保行動" },
                { q: "我們所吃的食物能量，最終追溯起來，原始來源都是太陽能。", a: "O", o: ["O","X"], exp: "植物靠光合作用將太陽能轉化為有機物，動物吃植物（或吃其他動物），能量沿食物鏈傳遞。", tag: "能量重要嗎" },
            ],

                { q: "扦插、壓條、嫁接和分株都屬於植物的無性生殖（營養繁殖）。", a: "O", o: ["O","X"], exp: "上述方法均不透過花粉受精，直接利用植物的莖、葉或根產生新個體，屬無性生殖。", tag: "植物有哪些繁殖方式" },
                { q: "蟲媒花的花粉通常輕且量多，以利隨風飄散傳播。", a: "X", o: ["O","X"], exp: "蟲媒花花粉黏重，量較少，靠昆蟲攜帶傳播；風媒花的花粉才是輕且量多的。", tag: "植物有哪些繁殖方式" },
                { q: "蒲公英種子頂端有白色冠毛，能讓種子隨風飄到遠處，屬於風力傳播。", a: "O", o: ["O","X"], exp: "蒲公英果實輕，冠毛像降落傘，遇風即可飄散至遠處傳播。", tag: "植物有哪些繁殖方式" },

                { q: "豬籠草等食蟲植物生長在氮素豐富的土壤中，靠捕蟲取得額外能量。", a: "X", o: ["O","X"], exp: "食蟲植物生長在缺乏氮素的貧瘠環境（如沼澤），才需要靠捕食昆蟲來補充氮素。", tag: "植物有哪些妙招" },

                { q: "固體、液體和氣體都具有熱脹冷縮的性質，其中氣體的熱脹冷縮程度最大。", a: "O", o: ["O","X"], exp: "氣體分子間距最大，受熱後膨脹程度遠大於液體，液體又大於固體。", tag: "溫度改變對物質的體積有何影響" },

                { q: "植物進行光合作用的主要場所是？", a: "葉片中的葉綠體", o: ["葉片中的葉綠體", "根部的根毛", "莖中的維管束", "花朵的花瓣"], exp: "葉片含有大量葉綠體，葉綠體中的葉綠素能捕捉光能，驅動光合作用。", tag: "植物如何製造養分" },

                { q: "葉片的氣孔主要功能是？", a: "讓CO₂進入，同時讓O₂和水蒸氣散出", o: ["讓CO₂進入，同時讓O₂和水蒸氣散出", "只允許CO₂通過，不讓水分散失", "只存在於莖上，讓莖呼吸", "夜晚打開進行光合作用"], exp: "氣孔是葉片與外界進行氣體交換（CO₂進入，O₂散出）和水分蒸散的通道。", tag: "植物如何製造養分" },
                { q: "植物在夜晚進行的生命活動是？", a: "只進行呼吸作用，釋放二氧化碳", o: ["只進行呼吸作用，釋放二氧化碳", "只進行光合作用，吸收二氧化碳", "同時進行光合作用和呼吸作用", "夜晚不進行任何生命活動"], exp: "光合作用需要光能，夜間無法進行；呼吸作用不需要光，全天持續進行。", tag: "植物如何製造養分" },
                { q: "遮蓋葉片的一部分使其不受陽光照射，再以碘液測試，結果是？", a: "受光部分變藍黑色，遮光部分不變色", o: ["受光部分變藍黑色，遮光部分不變色", "整片葉子都變藍黑色", "整片葉子都不變色", "遮光部分變藍黑色，受光部分不變色"], exp: "有光照的部分能行光合作用製造澱粉，遮光部分則否，所以只有受光部分變藍黑色。", tag: "植物如何製造養分" },
                { q: "下列哪種繁殖方式屬於有性生殖？", a: "以種子播種長出新植株", o: ["以種子播種長出新植株", "扦插", "壓條", "分株"], exp: "種子由花粉與卵細胞受精後發育而來，播種屬有性生殖；扦插、壓條、分株均為無性生殖。", tag: "植物有哪些繁殖方式" },
                { q: "玫瑰最常用哪種方式進行無性繁殖？", a: "扦插", o: ["扦插", "嫁接", "壓條", "孢子繁殖"], exp: "玫瑰常剪取莖段扦插繁殖，讓切口在土壤中長出不定根，發育成新植株。", tag: "植物有哪些繁殖方式" },
                { q: "蒲公英種子靠哪種方式傳播？", a: "風力傳播", o: ["風力傳播", "水力傳播", "動物吞食傳播", "彈射傳播"], exp: "蒲公英種子頂端有羽毛狀冠毛，質輕，隨風飄散可傳播至遠處。", tag: "植物有哪些繁殖方式" },
                { q: "鳳仙花種子的傳播方式是？", a: "果皮裂開，彈射種子", o: ["果皮裂開，彈射種子", "靠風力飛散", "靠水流漂走", "靠動物攜帶"], exp: "鳳仙花果實成熟後，果皮突然扭裂彈出種子，是典型的自力（彈射）傳播。", tag: "植物有哪些繁殖方式" },
                { q: "下列哪種植物靠「孢子」繁殖，而非種子？", a: "山蘇花（蕨類）", o: ["山蘇花（蕨類）", "蒲公英", "椰子樹", "玫瑰"], exp: "山蘇花是蕨類植物，葉背有孢子囊，成熟後散出孢子繁殖，不開花結果。", tag: "植物有哪些繁殖方式" },
                { q: "嫁接繁殖中，被切下接上去的枝條稱為？", a: "接穗", o: ["接穗", "砧木", "插穗", "壓條"], exp: "嫁接由砧木（根系強健的基底植物）提供水分養分，接穗（切下的目標品種枝條）提供果實品質。", tag: "植物有哪些繁殖方式" },
                { q: "馬鈴薯靠「芽眼」長出新植株，此繁殖方式屬於？", a: "無性生殖（以莖繁殖）", o: ["無性生殖（以莖繁殖）", "有性生殖", "孢子繁殖", "種子繁殖"], exp: "馬鈴薯塊莖是地下變態莖，芽眼是節，能直接萌芽長成新植株，屬無性生殖。", tag: "植物有哪些繁殖方式" },
                { q: "下列關於蟲媒花和風媒花的比較，哪項正確？", a: "風媒花花粉輕且量多；蟲媒花色彩鮮豔、常有香味", o: ["風媒花花粉輕且量多；蟲媒花色彩鮮豔、常有香味", "蟲媒花花粉輕且量多；風媒花色彩鮮豔", "風媒花有濃烈香味吸引昆蟲", "蟲媒花不需任何生物幫助授粉"], exp: "風媒花靠風傳粉，花粉輕量多；蟲媒花靠昆蟲，花色鮮豔、花粉黏且有蜜或香味。", tag: "植物有哪些繁殖方式" },
                { q: "含羞草受到碰觸後葉片閉合的現象，稱為？", a: "感觸性", o: ["感觸性", "向光性", "向地性", "向水性"], exp: "含羞草對觸碰刺激有反應（感觸性），葉枕細胞失水後葉片閉合，是一種保護機制。", tag: "植物有哪些妙招" },
                { q: "豬籠草需要捕食昆蟲的主要原因是？", a: "生長環境土壤缺乏氮素，靠捕蟲補充", o: ["生長環境土壤缺乏氮素，靠捕蟲補充", "無法行光合作用，靠消化昆蟲獲取能量", "昆蟲幫助其傳播花粉", "需要昆蟲來保護自己"], exp: "豬籠草能行光合作用，但生長在缺氮的沼澤地，需靠捕食昆蟲分解獲取氮素。", tag: "植物有哪些妙招" },
                { q: "仙人掌的針刺是由哪個器官特化而成的？", a: "葉", o: ["葉", "莖", "根", "花"], exp: "仙人掌的葉退化成針刺以減少水分散失，肥厚的莖則儲存大量水分，適應乾旱環境。", tag: "植物有哪些妙招" },
                { q: "菟絲子沒有葉綠素仍能存活，原因是？", a: "寄生在其他植物上，以吸器吸取養分", o: ["寄生在其他植物上，以吸器吸取養分", "從空氣中直接吸收有機物", "靠根大量吸收礦物質替代光合作用", "細胞能儲存足夠養分長期使用"], exp: "菟絲子是寄生植物，以特化的吸器插入宿主，吸取其水分和有機養分維生。", tag: "植物有哪些妙招" },
                { q: "植物幼苗向窗戶彎曲生長，是因為植物具有？", a: "向光性", o: ["向光性", "向地性", "感觸性", "向水性"], exp: "光照使莖背光側生長素濃度較高，生長較快，使莖向光源方向彎曲，稱向光性。", tag: "植物有哪些妙招" },
                { q: "爬牆虎能爬上光滑的牆壁，靠的是莖上的？", a: "吸盤", o: ["吸盤", "卷鬚", "氣根纏繞", "黏液固定"], exp: "爬牆虎的卷鬚末端有特化的圓形吸盤，能緊緊吸附在牆壁和岩石等光滑表面。", tag: "植物有哪些妙招" },
                { q: "馬鈴薯地下塊莖的主要功能是？", a: "儲存養分", o: ["儲存養分", "儲存水分", "行光合作用", "吸收水分和礦物質"], exp: "馬鈴薯塊莖是變態莖，儲存大量澱粉供植物生長所需，是人類的重要糧食作物。", tag: "植物有哪些妙招" },
                { q: "下列哪種植物能靠氣根懸掛在空中吸收水分與養分，並輔助支撐樹體？", a: "榕樹", o: ["榕樹", "仙人掌", "蒲公英", "含羞草"], exp: "榕樹的氣根從枝幹長出垂入土中，形成支柱根，幫助支撐龐大的樹冠並吸收水分。", tag: "植物有哪些妙招" },
                { q: "相同溫度變化下，哪種物質體積的變化最大？", a: "氣體", o: ["氣體", "液體", "固體", "三者相同"], exp: "氣體分子間距最大，受熱後膨脹幅度遠大於液體（遠大於固體），是熱脹冷縮最明顯的物態。", tag: "溫度改變對物質的體積有何影響" },
                { q: "溫度計能測量溫度，利用的是哪種物理現象？", a: "液體熱脹冷縮", o: ["液體熱脹冷縮", "固體熱脹冷縮", "氣體熱脹冷縮", "液體蒸發吸熱"], exp: "溫度計（酒精計或水銀計）利用液體受熱膨脹體積增大、遇冷縮小，液面高低表示溫度。", tag: "溫度改變對物質的體積有何影響" },
                { q: "把癟掉的乒乓球放入熱水中，球膨脹恢復圓形的原因是？", a: "球內氣體受熱體積膨脹", o: ["球內氣體受熱體積膨脹", "熱水使球皮軟化並撐開", "熱水浮力把球撐開", "外部氣壓增加"], exp: "乒乓球內的空氣受熱後體積增大，向外撐起球皮，是氣體熱脹冷縮的典型例子。", tag: "溫度改變對物質的體積有何影響" },
                { q: "鐵路鋼軌之間必須留縫隙，目的是？", a: "預防夏天鋼軌受熱膨脹時彎曲變形", o: ["預防夏天鋼軌受熱膨脹時彎曲變形", "幫助雨水排出，防止積水", "減少列車行駛時的震動", "節省建造材料"], exp: "鋼軌是固體，夏天高溫時受熱膨脹，縫隙提供膨脹空間，防止鋼軌因擠壓而翹曲變形。", tag: "溫度改變對物質的體積有何影響" },
                { q: "下列哪個現象不是熱脹冷縮的例子？", a: "冰塊加熱後融化成水", o: ["冰塊加熱後融化成水", "玻璃溫度計液柱隨溫度升高而上升", "夏天輪胎氣壓比冬天高", "橋梁設有伸縮縫"], exp: "冰塊融化是物態變化（固→液），與熱脹冷縮的概念不同；其餘三項均是熱脹冷縮的應用。", tag: "溫度改變對物質的體積有何影響" },
                { q: "同一條鐵軌在夏天和冬天，哪個較長？", a: "夏天（溫度高，固體熱脹）", o: ["夏天（溫度高，固體熱脹）", "冬天（低溫時固體較長）", "一樣長，溫度不影響固體長度", "取決於鐵軌的顏色"], exp: "固體熱脹冷縮，夏天高溫鐵軌受熱膨脹較長；冬天低溫收縮較短。", tag: "溫度改變對物質的體積有何影響" },
                { q: "把鐵湯匙放入熱湯中，湯匙柄逐漸變燙，這是哪種熱的傳播方式？", a: "熱傳導", o: ["熱傳導", "熱對流", "熱輻射", "熱擴散"], exp: "鐵湯匙是固體，熱從湯的高溫端沿湯匙傳至低溫端，屬於熱傳導。", tag: "熱是如何傳播" },
                { q: "液體和氣體中熱量的傳播主要靠？", a: "對流（熱流體上升，冷流體下沉）", o: ["對流（熱流體上升，冷流體下沉）", "傳導（粒子碰撞傳遞）", "輻射（電磁波傳遞）", "蒸發（液體氣化帶走熱量）"], exp: "流體受熱後密度降低上升，冷流體補充下沉，形成對流循環，是液體和氣體傳熱的主要方式。", tag: "熱是如何傳播" },
                { q: "太陽的熱能傳到地球，靠的是哪種方式？", a: "熱輻射（不需介質）", o: ["熱輻射（不需介質）", "熱傳導", "熱對流", "蒸發"], exp: "太陽與地球之間是真空，熱只能以輻射（電磁波）方式傳播，不需介質。", tag: "熱是如何傳播" },
                { q: "下列材料中，哪一種是熱的不良導體（絕熱體）？", a: "木頭", o: ["木頭", "銅", "鋁", "鐵"], exp: "木頭、塑膠、空氣是不良導體，導熱慢；銅、鋁、鐵是金屬，是良導體，導熱快。", tag: "熱是如何傳播" },
                { q: "白天海邊通常吹「海風」（海洋→陸地），原因是？", a: "陸地升溫快，熱空氣上升，海面冷空氣補充", o: ["陸地升溫快，熱空氣上升，海面冷空氣補充", "海面比陸地溫度高，海面空氣上升", "地球自轉產生偏向力", "海水蒸發推動空氣向陸地流動"], exp: "白天陸地升溫快，地面熱空氣上升，較冷的海面空氣流向陸地補充，形成「海風」。", tag: "熱是如何傳播" },
                { q: "燒開水時，鍋底的水受熱上升、上方冷水下沉，循環不已，這是？", a: "熱對流", o: ["熱對流", "熱傳導", "熱輻射", "蒸發冷卻"], exp: "水受熱後密度減小上升，冷水密度大下沉，形成對流循環，加速整鍋水受熱。", tag: "熱是如何傳播" },
                { q: "下列哪一種做法是為了「減少熱傳導」？", a: "鍋子的握柄用塑膠或木頭製造", o: ["鍋子的握柄用塑膠或木頭製造", "在電腦旁加電風扇加速冷卻", "太陽能板塗成黑色", "暖氣裝在房間下方"], exp: "塑膠和木頭是不良導體，能減少熱量由鍋體傳到手部（減少熱傳導），防止燙傷。", tag: "熱是如何傳播" },
                { q: "冷氣機安裝在房間上方、暖氣安裝在下方的原因是？", a: "冷空氣重會下沉，熱空氣輕會上升，利用對流使房間溫度均勻", o: ["冷空氣重會下沉，熱空氣輕會上升，利用對流使房間溫度均勻", "上方電線較多，安裝方便", "下方比較容易散熱", "避免小孩觸摸危險"], exp: "冷氣在上方讓冷空氣下沉均勻冷卻；暖氣在下方讓熱空氣上升均勻加熱，符合對流原理。", tag: "熱是如何傳播" },
                { q: "保溫瓶能長時間維持水溫，不包括利用下列哪種設計？", a: "瓶內裝加熱棒持續加熱", o: ["瓶內裝加熱棒持續加熱", "雙層玻璃間抽成真空", "內壁鍍銀反射輻射", "瓶塞隔熱減少傳導"], exp: "真空隔絕傳導和對流，鍍銀阻止輻射，瓶塞防傳導；保溫瓶靠「減少散熱」，非加熱。", tag: "如何保溫與散熱" },
                { q: "哪種顏色的物體吸收太陽輻射熱的速度最快？", a: "黑色", o: ["黑色", "白色", "黃色", "透明"], exp: "黑色能吸收幾乎所有波長的輻射，吸熱能力最強；白色則大量反射輻射，吸熱最慢。", tag: "如何保溫與散熱" },
                { q: "夏天穿白色衣服比黑色衣服涼爽，原因是？", a: "白色反射較多太陽輻射，身體吸熱少", o: ["白色反射較多太陽輻射，身體吸熱少", "白色布料比黑色薄透氣", "白色能加速排汗", "黑色阻止空氣對流"], exp: "白色對輻射的反射率高，吸收熱量少，使穿白色衣物的人感覺較涼爽。", tag: "如何保溫與散熱" },
                { q: "棉花和羽絨能有效保溫，主要是因為？", a: "內部含有大量靜止空氣，空氣是熱的不良導體", o: ["內部含有大量靜止空氣，空氣是熱的不良導體", "棉花和羽絨本身能產生熱量", "它們能反射所有輻射熱", "密度大能阻止熱傳導"], exp: "靜止空氣導熱性極差，棉花羽絨纖維間充滿靜止空氣，能有效阻止體熱散失。", tag: "如何保溫與散熱" },
                { q: "電腦CPU的散熱片通常用金屬鋁製造，目的是？", a: "利用鋁的良導熱性，快速將熱量傳走散熱", o: ["利用鋁的良導熱性，快速將熱量傳走散熱", "利用鋁的絕熱性保護CPU", "鋁顏色淺，輻射散熱效果好", "鋁重量輕不影響電腦重量"], exp: "散熱片需要快速傳熱，鋁是良導體，能迅速將CPU發出的熱量傳導至空氣中散逸。", tag: "如何保溫與散熱" },
                { q: "太陽能熱水器集熱板塗成黑色，目的是？", a: "黑色吸收太陽輻射熱的能力最強", o: ["黑色吸收太陽輻射熱的能力最強", "黑色反射紫外線保護板材", "黑色比其他顏色更耐用防鏽", "黑色是最便宜的顏色"], exp: "黑色能大量吸收太陽輻射，將光能轉為熱能加熱水，提高集熱效率。", tag: "如何保溫與散熱" },
                { q: "下列哪種做法屬於「增加散熱」的有效方法？", a: "在電腦旁加裝電風扇，加速空氣對流", o: ["在電腦旁加裝電風扇，加速空氣對流", "在電腦外殼貼泡棉隔熱板", "在電腦上蓋毛巾保溫", "將電腦放在密閉空間"], exp: "電風扇加速空氣流動，帶走電腦熱量（對流散熱）；泡棉和密閉空間則是保溫，會使電腦過熱。", tag: "如何保溫與散熱" },
            ],

            reading: [
                {
                    title: "家鄉的交通運輸",
                    article: "交通運輸讓人和物品得以移動，是家鄉發展的重要基礎。運輸依環境不同，分為陸運、水運和空運三大類。陸運在陸地上行駛，包括公路上的汽車、機車，以及鐵路上的火車和高鐵；水運在水面上行駛，包括河運和海運；空運在空中飛行，以飛機為主。\n各種運輸方式各有特色：空運速度最快，但費用最高；海運費用低、載運量大，適合大量貨物的跨海運輸；陸運最為普遍，高鐵更讓台灣形成「一日生活圈」。運輸可以依目的分為「客運」（載人）和「貨運」（載物）兩大類。",

                    qs: [

                        { q: "高鐵屬於哪種運輸方式？", a: "陸運", o: ["陸運", "水運", "空運", "海運"], exp: "高鐵在陸地上行駛，屬陸運。", tag: "家鄉的運輸" },
                        { q: "「一日生活圈」主要因哪種交通建設而實現？", a: "高鐵", o: ["高鐵", "公路", "輪船", "飛機"], exp: "高鐵大幅縮短南北交通時間。", tag: "家鄉的運輸" },
                        { q: "「貨運」的主要目的是？", a: "載物", o: ["載物", "載人", "觀光", "通訊"], exp: "貨運是載送物品；客運是載送旅客。", tag: "家鄉的運輸" },
                        { q: "以下哪種運輸方式速度最快？", a: "空運", o: ["空運", "海運", "鐵路", "公路"], exp: "空運以飛機飛行，速度最快。", tag: "家鄉的運輸" }
                    ]
                },
                {
                    title: "家鄉的特產與風貌",
                    article: "家鄉的風貌可以分為「自然景觀」和「人文景觀」。自然景觀包含山脈、河流、海岸等大自然形成的景色；人文景觀則是人類建造或創造的，例如廟宇、老街、古蹟等。\n家鄉的特產，是指一個地方最具代表性的物品或食物，通常和當地的自然環境密切相關。新北市鶯歌以燒製陶瓷聞名；嘉義阿里山因高山冷涼氣候適合茶樹生長，盛產高山茶；靠近海邊的地方，漁產豐富，海鮮成為特產。\n愛護家鄉，要從保持環境整潔做起，也要珍視並保存傳統文化，讓後代子孫能了解家鄉的歷史。",
                    tag: "閱讀",
                    qs: [
                        { q: "廟宇和老街屬於哪種景觀？", a: "人文景觀", o: ["人文景觀", "自然景觀", "生態景觀", "地理景觀"], exp: "人類建造的景觀稱為人文景觀。", tag: "家鄉的風貌" },

            { q: "下列哪一個不是再生能源的應用？", a: "火力發電", o: ["火力發電", "水力發電", "風力發電", "沼氣發電"], exp: "火力發電燃燒煤、石油等，屬非再生能源。" },
            { q: "臺灣自從有電之後，生活發生了什麼改變？", a: "出現許多家電用品", o: ["只能使用油燈", "作息隨日夜變換", "過著日出而作日入而息", "出現許多家電用品"], exp: "電力的普及帶動家電產品的大量使用。" },
            { q: "運用核能進行發電的過程會產生核廢料，核廢料存放不當可能造成哪種汙染？", a: "輻射汙染", o: ["輻射汙染", "噪音汙染", "空氣汙染", "光汙染"], exp: "核廢料具有放射性，存放不當會造成輻射汙染。" },
            { q: "畜牧場利用動物的廚餘和排泄物轉換為下列哪種發電能源？", a: "沼氣", o: ["風力", "火力", "沼氣", "核能"], exp: "動物排泄物經發酵可產生沼氣，屬再生能源。" },
            { q: "臺中市設有火力發電廠，受到哪種地形影響使汙染物不易擴散？", a: "盆地", o: ["平原", "盆地", "丘陵", "台地"], exp: "盆地地形不利空氣流通，使汙染物累積不易散去。" },
            { q: "「綠建築」不需要符合下列哪一項指標？", a: "高貴且與眾不同", o: ["與生態共存", "節約能源", "減少廢棄物", "高貴且與眾不同"], exp: "綠建築強調環保、節能、減廢，不以外觀高貴為目標。" },
            { q: "風力發電機運轉時，較可能產生哪一種汙染？", a: "噪音汙染", o: ["空氣汙染", "噪音汙染", "水汙染", "土壤汙染"], exp: "風力發電葉片高速旋轉時會產生噪音。" },
            { q: "日治時期，有些臺灣民眾會稱呼哪一個職業的日本人為「大人」？", a: "警察", o: ["老師", "鄰長", "警察", "醫生"], exp: "日治時期警察有很大的權力，民眾稱他們為「大人」。" },
            { q: "甲午戰爭後，哪位代表日本跟清帝國簽訂馬關條約？", a: "伊藤博文", o: ["田井輝雄", "廣內菊子", "伊藤博文", "高峰進六"], exp: "伊藤博文是當時日本的首相，代表日本簽訂馬關條約。" },
            { q: "甲午戰爭後，清帝國與日本簽訂的條約中，除了割讓臺灣，還有哪個地方也割讓給日本？", a: "澎湖", o: ["澎湖", "金門", "香港", "澳門"], exp: "馬關條約中，清帝國將臺灣和澎湖割讓給日本。" },
            { q: "日治時期，哪件史實的發生，使清帝國割讓臺灣，改變了臺灣的歷史？", a: "甲午戰爭", o: ["甲午戰爭", "中日戰爭", "朱一貴事件", "牡丹社事件"], exp: "甲午戰爭（1894-1895）清帝國戰敗，簽訂馬關條約割讓臺灣。" },
            { q: "書上有一幅藍地黃虎旗，這是臺灣以前的國旗。請問當時的國家名稱叫作什麼？", a: "臺灣民主國", o: ["中華民國", "臺灣共和國", "臺灣民主國", "臺灣帝國"], exp: "1895年日軍接收臺灣前，唐景崧成立臺灣民主國，使用藍地黃虎旗。" },
            { q: "下列何者不是日治時期皇民化運動的內容？", a: "多說臺灣話、聽中國傳統故事", o: ["推廣臺灣人穿和服", "學習日文說日語", "多說臺灣話聽中國傳統故事", "鼓勵臺灣人將姓名改成日本姓名"], exp: "皇民化運動目的是讓臺灣人認同日本，所以鼓勵說日語、穿和服、改日本姓名。" },
            { q: "日本取得臺灣的主要好處是什麼？", a: "臺灣擁有蔗糖、茶葉、樟腦等物產", o: ["臺灣是完全未開發的區域", "臺灣是亞洲最先進的地方", "臺灣有許多被俘虜的日軍", "臺灣擁有蔗糖茶葉樟腦等物產"], exp: "臺灣豐富的農業和自然資源（蔗糖、茶葉、樟腦）是日本殖民的重要動機。" },
            { q: "日治時期警察負責的工作，哪一項和現在臺灣警察的工作不同？", a: "控制思想及言論", o: ["取締交通違規者", "控制思想及言論", "逮捕罪犯", "維持治安"], exp: "現代民主社會的警察不負責控制人民的思想和言論。" },
            { q: "關於日本對臺灣殖民統治的敘述，下列何者錯誤？", a: "臺灣人完全享有與日本人相同的權利", o: ["占領初期有些人民組義軍抵抗", "臺灣人的抗日思想受日本警察管制", "臺灣人完全享有與日本人相同的權利", "總督府推行皇民化運動"], exp: "日治時期臺灣人受到差別待遇，不享有與日本人相同的權利。" },
            { q: "下列哪一件事情不是發生在日治時期？", a: "臺灣開港通商", o: ["西來庵事件", "臺灣開港通商", "霧社事件", "臺灣民報的創立"], exp: "臺灣開港通商發生在清朝（1858年天津條約後），不是日治時期。" },
            { q: "日治時期，原住民族抗日事件以哪一個事件犧牲最慘烈，影響也最大？", a: "霧社事件", o: ["郭懷一事件", "霧社事件", "牡丹社事件", "甲午戰爭"], exp: "1930年霧社事件，賽德克族莫那．魯道率族人反抗，是最重大的武裝抗日事件。" },
            { q: "日治時期，臺灣人創立的報刊，內容以批判時政及報導各種社會運動為主？", a: "臺灣民報", o: ["臺灣新聞報", "自由時報", "臺灣時報", "臺灣民報"], exp: "臺灣民報是日治時期臺灣人創立的報刊，以批判日本統治和報導社會運動為主。" },
            { q: "有關日治時期抗日行動的敘述，何者正確？", a: "蔣渭水等有識之士向總督府展開非武裝的抗爭行動", o: ["林獻堂帶領民眾在南部成立臺灣民主國", "蔣渭水等有識之士向總督府展開非武裝的抗爭行動", "莫那魯道領導的抗日事件獲得成功", "臺灣民主國是由原住民族組成的抗日組織"], exp: "蔣渭水等人以非武裝方式（文化協會、請願等）向日本政府爭取臺灣人的權利。" },
            { q: "霧社事件爆發的原因，與下列何者無關？", a: "被警察阻止參與臺灣文化協會", o: ["原本森林的資源被搶奪", "被要求服勞役", "傳統的生活方式被破壞", "被警察阻止參與臺灣文化協會"], exp: "霧社事件是原住民族因資源被掠奪、被強迫勞役、文化受壓迫所爆發的反抗。" },
            { q: "電影中部落領導者帶著族人反抗日本警察，這個領導者可能是誰？", a: "莫那．魯道", o: ["余清芳", "蔣渭水", "莫那．魯道", "李鴻章"], exp: "莫那．魯道是賽德克族部落領袖，領導霧社事件反抗日本統治。" },
            { q: "網路購物時，哪一種可能是付款的方式？", a: "以上方式都可能", o: ["線上刷卡", "行動支付", "貨到付款", "以上方式都可能"], exp: "現代網購支付方式多元，線上刷卡、行動支付、貨到付款均可。" },
            { q: "消費行為比較不會受到下列何者的影響？", a: "店員性別", o: ["個人收入", "個人喜愛", "店員性別", "商品價格"], exp: "消費行為主要受到個人收入、喜好、商品價格等因素影響，店員性別通常不是主要因素。" },
            { q: "遇到疑似詐騙行為，應馬上撥打什麼電話號碼求證？", a: "165", o: ["119", "113", "199", "165"], exp: "165是反詐騙諮詢專線，遇到詐騙疑問可撥打求證。" },
            { q: "下列哪一項不是在電商平台購買物品的好處？", a: "可以實際摸到商品", o: ["不用花時間出門", "商品可以直接送到家中", "可以實際摸到商品", "可以直接在網路上結帳"], exp: "電商購物無法實際觸摸商品，這是電商的缺點而非好處。" },
            { q: "在日常的經濟活動中，商品的價格通常由下列何者來決定？", a: "消費者與生產者互動的結果", o: ["政府公定價格", "消費者決定", "生產者決定", "消費者與生產者互動的結果"], exp: "市場經濟中，商品價格由供需雙方互動決定，即消費者與生產者共同決定。" },
            { q: "日治時期，日本統治臺灣後除了興建新式糖廠，也設立什麼機構從事糖業改良研究？", a: "糖業試驗場", o: ["製材工場", "臺灣文化協會", "糖業試驗場", "農田水利設施"], exp: "總督府設立糖業試驗場，引進新品種甘蔗，提升製糖技術。" },
            { q: "日治時期，哪個港口是臺灣與日本聯繫的重要門戶？", a: "基隆港", o: ["布袋港", "基隆港", "蘇澳港", "臺中港"], exp: "基隆港在日治時期是臺灣對外聯繫的重要港口，尤其是與日本的往來。" },
            { q: "日治時期臺灣最重要的水利工程是？", a: "嘉南大圳", o: ["八堡圳", "瑠公圳", "曹公圳", "嘉南大圳"], exp: "嘉南大圳是日治時期最大的灌溉工程，由八田與一設計，嘉惠嘉南平原。" },
            { q: "下列哪一項敘述與日治時期糖業情景不符？", a: "由日本大量進口蔗糖供應臺灣", o: ["引進優良甘蔗品種", "引進日本企業大規模投入生產", "設糖業試驗場從事糖業改良", "由日本大量進口蔗糖供應臺灣"], exp: "臺灣糖業是出口日本，而非由日本進口蔗糖。" },
            { q: "關於八田與一的敘述，哪一項錯誤？", a: "為了建造嘉南大圳，先建造了曾文水庫", o: ["是日本的土木工程師", "參與臺灣各地水利建設", "為了建造嘉南大圳先建造了曾文水庫", "被尊稱為嘉南大圳之父"], exp: "八田與一建造的是烏山頭水庫作為嘉南大圳的水源，曾文水庫是後來另行建造的。" },
            { q: "下列哪一項不是無形的投資？", a: "購買股票", o: ["強健體魄", "學習才藝", "吸收新知", "購買股票"], exp: "購買股票是有形（金錢）投資，不是無形投資。" },
            { q: "下列哪一項不屬於人生中可能會遇到的大筆金額支出？", a: "到早餐店買早餐", o: ["出國念書", "購買房屋", "到早餐店買早餐", "發生重大疾病"], exp: "到早餐店買早餐屬於日常小額消費，不是大筆支出。" },
            { q: "下列哪種做法會增加投資風險？", a: "憑感覺進行投資", o: ["定期關注經濟政策走向", "憑感覺進行投資", "上網查詢近期的財經報導", "事先諮詢理財專員"], exp: "憑感覺進行投資缺乏客觀分析，容易做出錯誤決策，增加投資風險。" },
            { q: "關於ESG的敘述，下列何者錯誤？", a: "社會責任：反對惡意併購", o: ["環境保護：施行對環境友善的公司政策", "社會責任：重視勞工權益", "社會責任：反對惡意併購", "公司治理：內部資訊透明化"], exp: "反對惡意併購屬於公司治理（Governance）的範疇，不是社會責任（Social）。" },
            { q: "下列哪一項較不可能是現今企業經營的目標？", a: "壓榨勞工以降低生產成本", o: ["獲得利潤", "壓榨勞工以降低生產成本", "在經濟發展與環境保護間取得平衡", "善盡社會責任"], exp: "現今企業應善盡社會責任，保障勞工權益，壓榨勞工是不道德的行為。" },
            { q: "日治時期，臺灣總督府建立新式教育制度，學習的「國語」是指哪一種語言？", a: "日語", o: ["日語", "英語", "閩南語", "原住民族語"], exp: "日治時期的「國語」是指日語，是日本帝國的官方語言。" },
            { q: "日治時期，臺中所建的師範學校，現今是哪所學校？", a: "國立臺中教育大學", o: ["國立臺灣大學", "國立中興大學", "國立臺灣師範大學", "國立臺中教育大學"], exp: "臺中師範學校（日治時期）演變為今日的國立臺中教育大學。" },
            { q: "1921年臺灣誕生第一位女醫師，主要與日治時期的什麼政策有關？", a: "將女性納入接受教育的對象", o: ["全民健康保險政策", "開放部分臺灣人的投票資格", "興建水利灌溉設施", "將女性納入接受教育的對象"], exp: "日治時期總督府將女性納入教育對象，讓女性有機會接受高等教育，才能培育出女醫師。" },
            { q: "日治時期，總督府在各地廣設學校，讓臺灣人學習日語和日本文化，最主要的目的是？", a: "有利於各項政策的宣導與推行", o: ["培養臺灣人成為傳教士", "保存並推廣臺灣原有的傳統文化", "增加臺灣女性的就學比率", "有利於各項政策的宣導與推行"], exp: "總督府推廣日語教育，是為了讓臺灣人理解並配合各項殖民政策。" },

            // MCQ

                { q: "低溫可以抑制微生物生長，因此冷藏食物可以延長保存期限。", a: "O", exp: "低溫能減慢微生物的代謝與繁殖速度，冷藏或冷凍是常用的食物保存方法。", tag: "生活中的食物保存" },
                { q: "醃漬食物（如泡菜）是利用高鹽分或酸性環境抑制有害菌的生長。", a: "O", exp: "高濃度的鹽或酸會使微生物脫水死亡，達到保存食物的效果。", tag: "生活中的食物保存" },
                { q: "真空包裝食品是藉由抽走包裝內的水分來延長食品保存期限。", a: "X", exp: "真空包裝是抽走包裝內的空氣（氧氣），減少微生物生長所需的氧氣，並非抽走水分。", tag: "生活中的食物保存" },
                { q: "煙燻和風乾食物的原理都是利用高溫殺死所有微生物。", a: "X", exp: "煙燻利用煙中的化學物質抑菌；風乾主要是去除水分，使微生物無法生存，並非靠高溫殺菌。", tag: "生活中的食物保存" },
                { q: "觀察動物的構造或習性並結合人類生活而發明出商品，此為仿生學。", a: "O", exp: "仿生學是從生物獲取靈感，向大自然學習並找出解決方法，應用在人類生活上的科學領域。", tag: "校園動物偵查員" },
                { q: "黑面琵鷺具有湯匙狀的長喙，可以在水中左右擺動，用來過濾水中的食物。", a: "O", exp: "黑面琵鷺的喙扁平呈湯匙狀，在水中左右搖擺捕捉魚蝦，是重要的候鳥。", tag: "校園動物偵查員" },
                { q: "仿生學中，高科技纖維泳衣的設計靈感來自鯊魚皮膚的鱗片構造。", a: "O", exp: "鯊魚皮膚上的V形鱗片能減少水的阻力，科學家模仿此構造設計出高科技纖維泳衣。", tag: "校園動物偵查員" },
                { q: "蜜蜂會用「搖擺舞」和「圓形舞」告知同伴食物的位置和距離。", a: "O", exp: "蜜蜂以舞蹈溝通食物方向、距離等資訊，是動物社會性行為的典型例子。", tag: "動物的生存之道" },
                { q: "章魚在遇到危險時，會噴出墨汁並快速改變體色來保護自己。", a: "O", exp: "章魚能噴出黑色墨汁干擾天敵視線，並快速改變皮膚顏色和質地，以偽裝躲避天敵。", tag: "動物的生存之道" },
                { q: "貓頭鷹用鮮豔的顏色警告天敵自己有毒，稱為警戒色。", a: "X", exp: "貓頭鷹並無毒性，也沒有鮮豔的警戒色。具有警戒色的例子如箭毒蛙。", tag: "動物的生存之道" },
                { q: "蝙蝠利用發出超聲波並接收回音的方式，在黑暗中定位和捕食，稱為回聲定位。", a: "O", exp: "蝙蝠以喉嚨或鼻子發出超聲波，偵測回聲判斷物體位置，人類模仿此原理發明了聲納和汽車雷達。", tag: "動物的生存之道" },
                { q: "有哺育行為的動物，通常一次產下的後代數量比沒有哺育行為的動物多。", a: "X", exp: "有哺育行為的動物每次生育後代較少，但存活率較高；無哺育行為的動物靠大量產卵提高存活機率。", tag: "動物的生命延續" },
                { q: "卵生動物的卵若沒有受精，仍然可以孵出子代。", a: "X", exp: "未受精的卵無法發育成完整的個體，只有受精卵才能正常發育孵化。", tag: "動物的生命延續" },
                { q: "大部分鳥類的親代都會哺餵牠們所生的幼鳥。", a: "O", exp: "鳥類通常具有哺育行為，親鳥會餵食幼鳥直到牠們能自行覓食。", tag: "動物的生命延續" },
                { q: "蜻蜓透過學習才能夠飛翔，是一種後天學習行為。", a: "X", exp: "蜻蜓羽化後天生就能飛翔，不需學習，屬於先天本能行為。", tag: "動物求生存的方式" },
                { q: "聲音的三要素是音量、音調和音色，分別對應振動的振幅、頻率和波形。", a: "O", exp: "音量由振幅決定，音調由頻率決定，音色由波形決定。", tag: "認識聲音三要素" },
                { q: "弦越細、越短、越緊，振動的頻率越低，音調也越低。", a: "X", exp: "弦越細、越短、越緊，振動頻率越高，音調越高。", tag: "認識聲音三要素" },
                { q: "聲音可以在真空中傳播，所以在太空中也能聽到爆炸聲。", a: "X", exp: "聲音是機械波，需要介質才能傳播，無法在真空中傳遞，太空中聽不到聲音。", tag: "認識聲音三要素" },
                { q: "噪音防治的方法包括在音源處降噪、在傳播途徑中隔音，以及在接收端使用防護裝備。", a: "O", exp: "噪音控制的三個層面：在音源減少振動、在傳播途徑隔音、在接收端防護（如耳塞）。", tag: "噪音與防治" },
                { q: "在音樂廳裡表演的聲樂家，唱出來的音量很大，對觀眾來說是一種噪音。", a: "X", exp: "噪音是令人不舒適或不需要的聲音，音樂廳的演唱是觀眾期待聆聽的音樂，不算噪音。", tag: "噪音與防治" },
                { q: "植物的葉片是進行光合作用的主要場所，葉片中的葉綠體能吸收光能。", a: "O", exp: "葉片含有大量葉綠體，能吸收太陽光能，利用二氧化碳和水合成有機養分。", tag: "植物如何獲取養分" },
                { q: "植物行光合作用時，會吸收氧氣、釋放二氧化碳。", a: "X", exp: "光合作用時，植物吸收二氧化碳和水，釋放出氧氣，與呼吸作用相反。", tag: "植物如何獲取養分" },
                { q: "落地生根的葉緣可以長出新的幼苗，這是一種以葉進行的無性生殖。", a: "O", exp: "落地生根葉緣的缺刻處能長出不定芽和不定根，落地後即可發育成新植株，屬於無性生殖。", tag: "植物有哪些繁殖方式" },
                { q: "馬鈴薯的塊莖上有「芽眼」，可以長出新芽，是一種以莖繁殖的方式。", a: "O", exp: "馬鈴薯的塊莖是地下變態莖，上面的芽眼能萌發新芽形成新植株，屬於營養繁殖。", tag: "植物有哪些繁殖方式" },
                { q: "溫度升高時，大多數固體、液體和氣體的體積都會膨脹。", a: "O", exp: "熱脹冷縮是多數物質的共同特性，溫度升高時物質分子運動加快，間距增大，體積膨脹。", tag: "溫度改變對物質的體積有何影響" },
                { q: "水在加熱時，體積的膨脹程度比空氣更大。", a: "X", exp: "氣體的熱膨脹程度遠大於液體，所以空氣的膨脹程度比水大得多。", tag: "溫度改變對物質的體積有何影響" },
                { q: "保溫瓶能保溫的原因，是因為瓶壁中有真空層阻止熱傳導和對流。", a: "O", exp: "真空保溫瓶雙層壁間抽成真空，阻止熱傳導和對流，達到保溫效果。", tag: "熱是如何傳播" },
                { q: "熱傳導是熱從溫度高的地方傳到溫度低的地方，這是熱的自然傳遞方向。", a: "O", exp: "熱能自然地由高溫處流向低溫處，直到兩者溫度相同（熱平衡）。", tag: "熱是如何傳播" },
                { q: "熱對流只發生在液體中，氣體不會發生對流現象。", a: "X", exp: "熱對流可以在液體和氣體中發生，熱空氣上升、冷空氣下降就是氣體的對流。", tag: "熱是如何傳播" },
                { q: "植物世界面面觀中，蓮花的葉子挺出水面，而睡蓮的葉子平浮在水面上。", a: "O", exp: "蓮花葉柄長，葉片挺出水面；睡蓮葉柄較短，葉片平浮在水面，是兩者的重要區別。", tag: "植物世界面面觀" },
            ],
            mcq: [
                { q: "下列哪一種情況下，鐵釘最不容易生鏽？", a: "放在乾燥的密封瓶中", o: ["放在裝有鹽水的容器中","放在潮濕的泥土裡","放在乾燥的密封瓶中","放在有水的燒杯旁邊"], exp: "生鏽需要水分和氧氣，乾燥密封環境缺少水分，最不容易生鏽。", tag: "生鏽知多少" },
                { q: "生鏽是一種什麼類型的變化？", a: "化學變化", o: ["物理變化","化學變化","物態變化","可逆變化"], exp: "鐵生鏽產生氧化鐵，生成了新物質，是化學變化，且不可逆。", tag: "生鏽知多少" },
                { q: "下列哪一種食物保存方法，主要是利用抑制微生物生長來延長保存期限？", a: "低溫冷藏", o: ["切碎食物","低溫冷藏","加熱烹調後立即食用","加水稀釋"], exp: "低溫能減慢微生物的生長和代謝速度，是現代常用的食物保存方法。", tag: "生活中的食物保存" },
                { q: "有關微生物在食品加工的運用，下列何者正確？", a: "用米麴菌製作味噌", o: ["用青黴菌做成豆腐乳","用米麴菌做成藍紋起司","用青黴菌做成醬油","用米麴菌製作味噌"], exp: "米麴菌是製作味噌、醬油、清酒的重要菌種。", tag: "生活中的食物保存" },
                { q: "下列哪一種食物保存方法，是利用降低食物中的水分活性來抑制微生物生長？", a: "鹽漬醃製", o: ["真空包裝","低溫冷凍","鹽漬醃製","罐頭殺菌"], exp: "鹽漬利用滲透壓使微生物脫水，降低水分活性，抑制其生長。", tag: "生活中的食物保存" },
                { q: "汽車雷達是參考下列哪一種動物的聽覺定向系統設計的？", a: "蝙蝠", o: ["青蛙","海龜","蝙蝠","黑面琵鷺"], exp: "蝙蝠利用超聲波回聲定位，人類模仿此原理發明了聲納及汽車雷達等設備。", tag: "校園動物偵查員" },
                { q: "從生物獲取靈感，向大自然學習並應用在人類生活上的科學，稱為什麼？", a: "仿生學", o: ["仿物學","仿生學","維生學","自然學"], exp: "仿生學（Bionics）是研究生物構造與功能，並應用於工程設計的學科。", tag: "校園動物偵查員" },
                { q: "枯葉蝶停在樹枝上時，外觀與枯葉極為相似，這種保護自己的方式稱為什麼？", a: "擬態", o: ["警戒色","保護色","擬態","反蔭蔽"], exp: "擬態是指生物模仿其他物體（如枯葉、樹皮）的外觀，以迷惑天敵。", tag: "動物的生存之道" },
                { q: "下列哪一種動物不屬於社會性群居動物？", a: "鱷魚", o: ["蜜蜂","螞蟻","鱷魚","臺灣獼猴"], exp: "蜜蜂、螞蟻有嚴密社會分工，臺灣獼猴有族群結構，鱷魚則通常獨居。", tag: "動物求生存的方式" },
                { q: "下列哪一種動物會以發光方式進行求偶？", a: "螢火蟲", o: ["蜜蜂","螢火蟲","臺灣獼猴","黑面琵鷺"], exp: "螢火蟲以特定的閃光節奏發出求偶信號，不同種螢火蟲的閃光模式不同。", tag: "動物延續生命的方式" },
                { q: "下列關於「卵生」的敘述，哪一個是錯誤的？", a: "卵沒有受精仍然可以孵出子代", o: ["母體會將卵排出體外","由卵提供胚胎發育需要的養分","卵沒有受精仍然可以孵出子代","胚胎發育成完整個體後才從卵孵化出來"], exp: "未受精的卵缺少完整的遺傳物質，無法正常發育成個體。", tag: "動物的生命延續" },
                { q: "下列哪一項關於動物求偶行為的敘述是正確的？", a: "雌蠶蛾分泌費洛蒙吸引雄蠶蛾", o: ["螢火蟲跳求偶舞吸引異性","雄孔雀大聲鳴叫吸引雌孔雀","雌蠶蛾分泌費洛蒙吸引雄蠶蛾","企鵝展示鮮豔羽毛求偶"], exp: "雌蠶蛾釋放性費洛蒙，雄蠶蛾用觸角偵測氣味，可從數公里外被吸引。", tag: "動物延續生命的方式" },
                { q: "聲音在下列哪一種介質中傳播速度最慢？", a: "空氣", o: ["鋼鐵","水","空氣","木頭"], exp: "聲速在固體中最快，液體次之，氣體最慢。在20°C時，聲音在空氣中約343m/s。", tag: "認識聲音三要素" },
                { q: "彈奏吉他時，按壓琴頸不同位置（改變弦長）主要控制聲音的哪個要素？", a: "音調高低", o: ["音量大小","音調高低","音色差異","音量和音色"], exp: "弦的有效長度縮短，振動頻率增加，音調升高。", tag: "認識聲音三要素" },
                { q: "下列哪一種方法是在「傳播途徑」上進行噪音防治？", a: "在道路旁設置隔音牆", o: ["在工廠機器上安裝消音器","在道路旁設置隔音牆","工人配戴防噪耳塞","降低汽車引擎轉速"], exp: "隔音牆設置在聲音傳播的路徑中，阻止噪音擴散，屬於在傳播途徑中控制噪音。", tag: "噪音與防治" },
                { q: "植物行光合作用時，需要哪些原料？", a: "二氧化碳、水和光能", o: ["氧氣和水","二氧化碳、水和光能","氧氣、礦物質和光能","二氧化碳和氧氣"], exp: "光合作用的方程式：二氧化碳+水+光能→葡萄糖+氧氣，原料為CO₂、H₂O和光能。", tag: "植物如何獲取養分" },
                { q: "下列哪一種植物可以用葉來繁殖？", a: "落地生根", o: ["甘藷","落地生根","玉米","胡蘿蔔"], exp: "落地生根的葉緣缺刻會長出帶根的小芽，落地後即可成長為新植株。", tag: "植物有哪些繁殖方式" },
                { q: "花朵完成授粉後，哪一個部位發育成種子？", a: "胚珠", o: ["雄蕊","花萼","子房","胚珠"], exp: "受精後，胚珠發育成種子，子房（含胚珠）則發育成果實。", tag: "植物有哪些繁殖方式" },
                { q: "依據「葉脈是否為網狀脈」分類，下列哪一組植物應分在同一類？", a: "桑和蓮花", o: ["桑和蓮花","百合和蓮花","綠竹和蓮花","百合和綠竹"], exp: "桑和蓮花均為網狀葉脈（雙子葉植物），百合和綠竹是平行葉脈（單子葉植物）。", tag: "植物世界面面觀" },
                { q: "將不同容器裝同量熱水靜置一小時，哪一種容器的水溫最高？", a: "真空隔熱杯", o: ["紙杯","玻璃杯","陶瓷杯","真空隔熱杯"], exp: "真空隔熱杯的雙層壁間為真空，能有效阻止熱傳導、對流和輻射，保溫效果最好。", tag: "熱是如何傳播" },
                { q: "熱輻射的傳播方式和熱傳導、熱對流的最大差異是什麼？", a: "熱輻射不需要介質，可以在真空中傳遞", o: ["熱輻射傳播速度最慢","熱輻射只能向上傳播","熱輻射不需要介質，可以在真空中傳遞","熱輻射只發生在固體中"], exp: "熱輻射以電磁波形式傳遞熱能，不需要介質，可在真空中傳播（如太陽熱能傳至地球）。", tag: "熱是如何傳播" },
                { q: "下列哪一種現象不是熱脹冷縮的應用或例子？", a: "冰塊放入水中逐漸融化", o: ["鐵路鋼軌之間留有縫隙","玻璃溫度計液柱隨溫度升降","冰塊放入水中逐漸融化","夏天輪胎氣壓比冬天高"], exp: "冰塊融化是物態變化，與熱脹冷縮無關；其他選項都是熱脹冷縮的實例。", tag: "溫度改變對物質的體積有何影響" },
                { q: "下列哪一項正確描述了熱對流現象？", a: "熱水上升、冷水下沉形成循環", o: ["熱從金屬棒的一端傳到另一端","熱水上升、冷水下沉形成循環","太陽的熱能傳到地球","烤箱中食物被加熱"], exp: "對流是流體因溫度差造成密度不同而產生的流動，熱流體上升、冷流體下沉，形成對流循環。", tag: "熱是如何傳播" },
                { q: "蚯蚓透過哪種方式在土壤中前進？", a: "身體肌肉交替收縮與舒張", o: ["依靠足部行走","身體肌肉交替收縮與舒張","靠腹足波浪爬行","靠噴水反推進"], exp: "蚯蚓沒有骨骼和四肢，靠縱肌和環肌交替收縮伸張，配合剛毛抓地，波浪狀蠕動前進。", tag: "動物的身體構造和運動" },

        function _ep(arr, ex=[]) {
            let p = arr.filter(x => !ex.includes(x));
            return p[Math.floor(Math.random() * p.length)];
        }
        function _e4(correct, w1, w2, w3) {
            let ws = [w1,w2,w3].filter(Boolean);
            while (ws.length < 3) ws.push(ws[0]);
            return [correct,...ws].sort(()=>Math.random()-0.5);
        }
        function _cap(s){ return s ? s[0].toUpperCase()+s.slice(1) : s; }
        function _2ch(){ let a=shuffle([...ENG_V.chars]); return [a[0],a[1]]; }
        function _3ch(){ let a=shuffle([...ENG_V.chars]); return [a[0],a[1],a[2]]; }

        function genG4A_Friend(){

            const w_cities=cities.filter(c=>c!==city1&&c!==city2);

                article:`${c1}: Hi! My name is ${c1}. What is your name?\n${c2}: My name is ${c2}. Nice to meet you!\n${c1}: Nice to meet you too. Where are you from?\n${c2}: I am from ${city2}. And you?\n${c1}: I am from ${city1}. Do you like school?\n${c2}: Yes! I like ${s1} class. What about you?\n${c1}: I like ${s2} class. Can we be friends?\n${c2}: Of course! Let's ${act} after school!`,

        // Generate wrong answers for science questions
        function generateWrongAnswers(question, correctAnswer, tag) {
            let wrongAnswers = [];
            let ans = correctAnswer.toString().trim();

            // Common science-related wrong answers based on patterns
            const commonWrong = {
                '控制': ['操縱', '應變', '實驗'],
                '明顯': ['不明顯', '相同', '微弱'],
                '低': ['高', '中', '無'],
                '不可': ['可', '必須', '應該'],
                '陽': ['月', '星', '燈'],
                '氣': ['液', '固', '水'],
                '南': ['北', '東', '西'],
                '真空': ['空氣', '水', '固體'],
                '不會': ['會', '可能', '有時'],
                '絕緣': ['導', '半導', '超導'],
                '上升': ['下降', '不變', '消失'],
                '水': ['油', '氣', '土'],
                '反': ['折', '散', '透'],
                '溫': ['長', '高', '重'],
                '6': ['4', '8', '10'],
                '1': ['2', '7', '30'],
                '浮': ['重', '壓', '拉'],
                '負': ['正', '中', '零'],
                '氧': ['氮', '氫', '碳']
            };

            // If we have predefined wrong answers, use them
            if (commonWrong[ans]) {
                wrongAnswers = commonWrong[ans].slice(0, 3);
            } else {
                // Generate based on answer type
                if (!isNaN(ans)) {
                    // Numeric answer - generate nearby numbers
                    let num = parseInt(ans);
                    wrongAnswers = [
                        (num + 1).toString(),
                        (num - 1).toString(),
                        (num * 2).toString()
                    ].filter(x => x !== ans && parseInt(x) > 0);
                } else if (ans.length === 1) {
                    // Single character - provide common alternatives
                    wrongAnswers = ['是', '否', '對', '錯', '有', '無'].filter(x => x !== ans).slice(0, 3);
                } else if (ans.length === 2) {
                    // Two characters - provide related terms
                    wrongAnswers = ['正確', '錯誤', '可能', '不行', '必須'].filter(x => x !== ans).slice(0, 3);
                } else {
                    // Longer answers - provide generic options
                    wrongAnswers = ['其他選項', '以上皆非', '無法確定'].slice(0, 3);
                }
            }

            // Ensure we have at least 3 wrong answers
            while (wrongAnswers.length < 3) {
                wrongAnswers.push(`選項${wrongAnswers.length + 1}`);
            }

            return wrongAnswers.slice(0, 3);
        }
