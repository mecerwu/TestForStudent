                    if (currentGrade === 0) db = SRC_SOC_G4_A;
                    else if (currentGrade === 1) db = SRC_SOC_G4_B;
                    else if (currentGrade === 2) db = SRC_SOC_G5_A;
                    else db = SRC_SOC_G5_B;
                }

                // Special handling for Science - convert all to MCQ
                if (currentSubject === 'science' && (currentGrade === 1 || currentGrade === 3)) {
                    // 五下自然: 20題是非 + 20題選擇
                    let rawTf = shuffle(getSafe(db.tf || []));
                    while (fills.length < 20) {
                        if (rawTf.length > 0) {
                            let q = rawTf.pop(); q.type = 'mcq'; q.o = ["O", "X"];
                            fills.push(q);
                        } else fills.push({ q: '補充題', a: 'O', o: ['O', 'X'], type: 'mcq', exp: '' });
                    }
                    let rawMcqSci = shuffle(getSafe(db.mcq || []));
                    while (mcqs.length < 20) {
                        if (rawMcqSci.length > 0) {
                            let q = rawMcqSci.pop(); q.type = 'mcq';
                            if (!q.o) q.o = ["A", "B", "C", "D"]; q.o = shuffleOptions(q.o);
                            mcqs.push(q);
                        } else mcqs.push({ q: '補充題', a: 'A', o: ['A', 'B', 'C', 'D'], type: 'mcq' });
                    }
                    // words stays empty []
                } else if (currentSubject === 'science') {
                    // Part I: Convert fill questions to MCQ
                    let rawFill = shuffle(getSafe(db.backup_fill || db.fill || []));
                    while (fills.length < 15) {
                        if (rawFill.length > 0) {
                            let q = rawFill.pop();
                            q.type = 'mcq';
                            // Generate options if not present
                            if (!q.o) {
                                let correctAns = q.a.toString();
                                let opts = new Set([correctAns]);
                                // Generate plausible wrong answers based on question type
                                let wrongAnswers = generateWrongAnswers(q.q, correctAns, q.tag);
                                wrongAnswers.forEach(wa => opts.add(wa));
                                q.o = shuffleOptions(Array.from(opts).slice(0, 4));
                            }
                            fills.push(q);
                        } else fills.push({ q: `補充題`, a: "A", o: ["A", "B", "C", "D"], type: 'mcq' });
                    }
                    // Part II: MCQ (already MCQ format)
                    let rawMcq = shuffle(getSafe(db.backup_mcq || db.mcq || []));
                    while (mcqs.length < 15) {
                        if (rawMcq.length > 0) {
                            let q = rawMcq.pop(); q.type = 'mcq';
                            if (!q.o) q.o = ["A", "B", "C", "D"]; q.o = shuffleOptions(q.o);
                            mcqs.push(q);
                        } else mcqs.push({ q: "補位", a: "A", o: ["A", "B"], type: 'mcq' });
                    }
                    // Part III: Convert word problems to MCQ
                    let rawWord = shuffle(getSafe(db.word || db.backup_word || []));
                    while (words.length < 10) {
                        if (rawWord.length > 0) {
                            let q = rawWord.pop();
                            q.type = 'mcq';
                            // Generate options if not present
                            if (!q.o) {
                                let correctAns = q.a.toString();
                                let opts = new Set([correctAns]);
                                let wrongAnswers = generateWrongAnswers(q.q, correctAns, q.tag);
                                wrongAnswers.forEach(wa => opts.add(wa));
                                q.o = shuffleOptions(Array.from(opts).slice(0, 4));
                            }
                            words.push(q);
                        } else words.push({ q: `情境應用`, a: "A", o: ["A", "B", "C", "D"], type: 'mcq', exp: "應用" });
                    }
                } else if (currentSubject === 'social') {
                    // 所有社會年級: 10是非 + 10選擇 + 10小文章 + 10配合
                    let rawTf = shuffle(getSafe(db.tf || []));
                    while (fills.length < 10) {
                        if (rawTf.length > 0) {
                            let q = rawTf.pop(); q.type = 'mcq'; q.o = ["O", "X"];
                            fills.push(q);
                        } else fills.push({ q: '補充是非題', a: 'O', o: ['O', 'X'], type: 'mcq', exp: '' });
                    }
                    let rawMcqS = shuffle(getSafe([...(db.mcq || []), ...(db.mcq_extra || [])]));
                    while (mcqs.length < 10) {
                        if (rawMcqS.length > 0) {
                            let q = rawMcqS.pop(); q.type = 'mcq';
                            if (!q.o) q.o = ["A", "B", "C", "D"]; q.o = shuffleOptions(q.o);
                            mcqs.push(q);
                        } else mcqs.push({ q: '補充選擇題', a: 'A', o: ['A', 'B', 'C', 'D'], type: 'mcq' });
                    }
                    // 小文章: 2 passages × 5 questions
                    let rawReading = shuffle(getSafe(db.reading || []));
                    let passages = rawReading.slice(0, 2);
                    passages.forEach((passage, rIdx) => {
                        let pqs = passage.qs || [];
                        pqs.slice(0, 5).forEach((rq, qi) => {
                            let item = { ...rq, type: 'mcq', tag: rq.tag || '閱讀' };
                            if (qi === 0) {
                                item._articleTitle = `文章 ${rIdx + 1}：${passage.title}`;
                                item._articleContent = passage.article.replace(/\n/g, '<br>');
                            }
                            if (!item.o) item.o = ["A", "B", "C", "D"];
                            item.o = shuffleOptions(item.o);
                            words.push(item);
                        });
                    });
                    while (words.length < 10) words.push({ q: '補充閱讀題', a: 'A', o: ['A','B','C','D'], type: 'mcq' });
                    // 配合題
                    let rawMatching = shuffle(getSafe(db.matching || []));
                    matching = rawMatching.slice(0, 10);
                    while (matching.length < 10) matching.push({ term: '補充詞', match: '補充答案', tag: '配合' });
                } else if (currentSubject === 'english') {
                    // Part I: 10 fill
                    let rawFill = shuffle(getSafe(db.fill || []));
                    while (fills.length < 10) {
                        if (rawFill.length > 0) fills.push({ ...rawFill.pop(), type: 'fill' });
                        else fills.push({ q: `填充題(補充)`, a: "0", type: 'fill' });
                    }
                    // Part II: 10 MCQ
                    let rawMcq = shuffle(getSafe(db.mcq || []));
                    while (mcqs.length < 10) {
                        if (rawMcq.length > 0) {
                            let q = rawMcq.pop(); q.type = 'mcq';
                            if (!q.o) q.o = ["A", "B", "C", "D"]; q.o = shuffleOptions(q.o);
                            mcqs.push(q);
                        } else mcqs.push({ q: "選擇題(補充)", a: "A", o: ["A", "B", "C", "D"], type: 'mcq' });
                    }
                    // Part III: 10 listening (2-option)
                    let rawListen = shuffle(getSafe(db.listening || []));
                    while (listening.length < 10) {
                        if (rawListen.length > 0) {
                            let q = rawListen.pop(); q.type = 'listen';
                            q.o = shuffle([...q.o]); // randomize option order
                            listening.push(q);
                        } else listening.push({ speak: "Hello.", q: "聽力補充題", a: "Hello", o: ["Hello", "Goodbye"], type: 'listen', exp: '' });
                    }
                    // Part IV: Story Reading
                    let gens = shuffle([...(ENG_STORY_GEN[currentGrade] || ENG_STORY_GEN[3])]).slice(0, 2);
                    gens.forEach((gen, rIdx) => {
                        let r = gen();
                        r.qs.forEach((q, qIdx) => {
                            let finalQ = { ...q, type: 'mcq', tag: q.tag || '閱讀' };
                            finalQ._storyTitle = r.title;
                            if (qIdx === 0) {
                                finalQ._articleTitle = `Story ${rIdx + 1}: ${r.title}`;
                                finalQ._articleContent = r.article.replace(/\n/g, '<br>');
                            }
                            finalQ.o = shuffleOptions(finalQ.o);
                            words.push(finalQ);
                        });
                    });
                    while (words.length < 10) words.push({ q: '補充題', a: 'A', o: ['A','B','C','D'], type: 'mcq' });
                }
            }
            return { fills, mcqs, words, idioms, matching, listening, wrongChars, courseWords };
        }

        function initQuiz() {
            _wcSelections = {};  // 重置找錯字選取狀態
            const data = generateData();

            // Inject wrong-bank questions: replace last N questions in fills/mcqs
            if (wrongBankInjected.length > 0) {
                let injectList = shuffle([...wrongBankInjected]);
                // Determine which pool to inject into based on q.o length
                let tfWrongs  = injectList.filter(q => Array.isArray(q.o) && q.o.length <= 2).map(q => Object.assign({}, q, {type:'mcq'}));
                let mcqWrongs = injectList.filter(q => Array.isArray(q.o) && q.o.length > 2).map(q => Object.assign({}, q, {type:'mcq'}));
                let fillWrongs= injectList.filter(q => !Array.isArray(q.o)).map(q => Object.assign({}, q, {type:'fill'}));
                // Replace tail of fills with tf/fill wrongs, tail of mcqs with mcq wrongs
                let allFillWrongs = [...tfWrongs, ...fillWrongs];
                let fillsSlots = Math.min(allFillWrongs.length, Math.floor(data.fills.length / 2));
                let mcqSlots = Math.min(mcqWrongs.length, Math.floor(data.mcqs.length / 2));
                if (fillsSlots > 0) data.fills.splice(data.fills.length - fillsSlots, fillsSlots, ...allFillWrongs.slice(0, fillsSlots));
                if (mcqSlots > 0) data.mcqs.splice(data.mcqs.length - mcqSlots, mcqSlots, ...mcqWrongs.slice(0, mcqSlots));
                wrongBankInjected = [];
            }

            // Dynamic titles based on subject
            let part1Title, part2Title, part3Title;

            if (currentSubject === 'science' && (currentGrade === 1 || currentGrade === 3)) {
                part1Title = "一、是非題 (1-20)";
                part2Title = "二、選擇題 (21-40)";
                part3Title = "";
            } else if (currentSubject === 'science') {
                // Science: all MCQ
                part1Title = "Part I: 選擇題 (1-15)";
                part2Title = "Part II: 選擇題 (16-30)";
                part3Title = "Part III: 選擇題 (31-40)";
            } else if (currentSubject === 'english') {
                part1Title = "Part I: 填充題 (1-10)";
                part2Title = "Part II: 選擇題 (11-20)";
                part3Title = "Part III: 聽力測驗 (21-30)";
            } else if (currentSubject === 'chinese') {
                let db2 = currentGrade === 0 ? SRC_CHI_G4_A : (currentGrade === 1 ? SRC_CHI_G4_B : SRC_CHI_G5);
                if (db2.charToPhonetic) {
                    part1Title = currentGrade === 3 ? "一、注音選擇 (1-10)" : "一、國字注音 (1-10)";
                    part2Title = currentGrade === 3 ? "二、找錯字 (11-20)" : "二、注音國字 (11-20)";
                    part3Title = "三、情境成語 (21-30)";
                } else {
                    part1Title = "Part I: 填充題 (1-15)";
                    part2Title = "Part II: 選擇題 (16-30)";
                    part3Title = "Part III: 閱讀測驗 (31-40)";
                }
            } else if (currentSubject === 'social') {
                part1Title = "一、是非題 (1-10)";
                part2Title = "二、選擇題 (11-20)";
                part3Title = "三、小文章選擇題 (21-30)";
            } else if (currentSubject === 'math' && (currentGrade === 1 || currentGrade === 3)) {
                // 四下/五下數學: 10+10+20
                part1Title = "一、填充題 (1-10)";
                part2Title = "二、選擇題 (11-20)";
                part3Title = "三、應用題 (21-40)";
            } else {
                // Other subjects: traditional format with application
                part1Title = "Part I: 填充題 (1-15)";
                part2Title = "Part II: 選擇題 (16-30)";
                part3Title = "Part III: 應用題 (31-40)";
            }

            if (currentSubject === 'science' && (currentGrade === 1 || currentGrade === 3)) {
                questionsByPage = [
                    { title: part1Title, qs: data.fills },
                    { title: part2Title, qs: data.mcqs }
                ];
            } else if (currentSubject === 'social') {
                questionsByPage = [
                    { title: part1Title, qs: data.fills },
                    { title: part2Title, qs: data.mcqs },
                    { title: part3Title, qs: data.words },
                    { title: "四、配合題 (31-40)", qs: data.matching, isMatching: true }
                ];
            } else if (currentSubject === 'english') {
                questionsByPage = [
                    { title: part1Title, qs: data.fills },
                    { title: part2Title, qs: data.mcqs },
                    { title: part3Title, qs: data.listening, isListening: true },
                    { title: "Part IV: Story Reading (31-40)", qs: data.words }
                ];
            } else if (currentSubject === 'chinese' && (currentGrade === 1 || currentGrade === 3) && data.wrongChars && data.wrongChars.length > 0) {
                // 五下國語: 5 sections
                questionsByPage = [
                    { title: "一、注音選擇 (1-10)",   qs: data.fills,       pointsPerQ: 1 },
                    { title: "二、找錯字 (11-20)",     qs: data.wrongChars,  pointsPerQ: 1, isWrongChar: true },
                    { title: "三、情境成語 (21-30)",   qs: data.idioms,      pointsPerQ: 2 },
                    { title: "四、閱讀測驗 (31-40)",   qs: data.words,       pointsPerQ: 2 },
                    { title: "五、課文問答 (41-60)",   qs: data.courseWords, pointsPerQ: 2 }
                ];
            } else if (currentSubject === 'chinese' && data.idioms && data.idioms.length > 0) {
                questionsByPage = [
                    { title: part1Title, qs: data.fills },
                    { title: part2Title, qs: data.mcqs },
                    { title: part3Title, qs: data.idioms },
                    { title: "四、閱讀測驗 (31-40)", qs: data.words }
                ];
            } else {
                questionsByPage = [
                    { title: part1Title, qs: data.fills },
                    { title: part2Title, qs: data.mcqs },
                    { title: part3Title, qs: data.words }
                ];
            }

            let container = document.getElementById('quiz-container');
            container.innerHTML = '';

            let globalQIndex = 1;

            questionsByPage.forEach((pageData, pIdx) => {
                let pageDiv = document.createElement('div');
                pageDiv.id = `page-${pIdx}`;
                pageDiv.className = 'page';
                if (pIdx === 0) pageDiv.classList.add('active');

                let html = `<div class="sec-title">${pageData.title}</div>`;

                if (pageData.isMatching) {
                    // Build drag-and-drop matching UI
                    let matchTerms = pageData.qs; // array of {term, match, tag}
                    let shuffledAnswers = shuffle(matchTerms.map(m => m.term));

                    html += `<div class="matching-container">
                        <div class="matching-answers">
                            <div class="match-answers-title">▼ 將下方答案拖到題目右側的空格上（點選已填答案可取消）▼</div>
                            <div class="match-chips" id="match-chips-${pIdx}">`;
                    shuffledAnswers.forEach((ans, i) => {
                        html += `<div class="match-chip" draggable="true" data-answer="${ans}"
                                      ondragstart="dragStartMatch(event)">${ans}</div>`;
                    });
                    html += `</div></div>
                        <div class="matching-terms">`;
                    matchTerms.forEach((m, i) => {
                        let qNum = globalQIndex + i;
                        html += `<div class="match-row">
                            <span class="q-label">【第 ${qNum} 題】</span>
                            <span class="match-term">${m.match}</span>
                            <div class="match-drop" data-match-idx="${i}" data-correct="${m.term}"
                                 ondragover="event.preventDefault()"
                                 ondrop="dropMatch(event, this)"
                                 ondragenter="this.classList.add('drag-over')"
                                 ondragleave="this.classList.remove('drag-over')"
                                 onclick="clearMatch(this)">請拖入答案</div>
                        </div>`;
                    });
                    html += `</div></div>`;
                    globalQIndex += matchTerms.length;
                    pageDiv.innerHTML = html;
                    container.appendChild(pageDiv);
                    return; // skip normal rendering
                }

                if (pageData.isWrongChar) {
                    pageData.qs.forEach((q, qIdx) => {
                        let absIdx = (pIdx * 100) + qIdx;
                        let qNum = globalQIndex + qIdx;
                        // Split sentence into characters, preserve punctuation as non-clickable
                        let charSpans = '';
                        for (let ci = 0; ci < q.sentence.length; ci++) {
                            let ch = q.sentence[ci];
                            // Make Chinese characters clickable, others are static
                            if (/[一-鿿]/.test(ch)) {
                                charSpans += `<span class="wc-char" onclick="toggleWrongChar(${absIdx},${ci})" data-ci="${ci}">${ch}</span>`;
                            } else {
                                charSpans += `<span class="wc-punct">${ch}</span>`;
                            }
                        }
                        html += `<div class="card wrongchar-card">
                            <div class="card-header">
                                <span class="q-label">【第 ${qNum} 題】</span> <span class="tag">找錯字</span>
                            </div>
                            <div class="q-txt">找出句子中的 <strong>2個錯字</strong> 並點選：</div>
                            <div class="wrongchar-sentence" id="wc-${absIdx}">${charSpans}</div>
                            <div class="wrongchar-hint">已選 <span class="wc-sel-count" id="wc-cnt-${absIdx}">0</span>/2 個</div>
                            <input type="hidden" id="ans-${absIdx}" value="">
                        </div>`;
                    });
                    globalQIndex += pageData.qs.length;
                    pageDiv.innerHTML = html;
                    container.appendChild(pageDiv);
                    return;
                }

                if (pageData.isListening) {
                    pageData.qs.forEach((q, qIdx) => {
                        let absIdx = (pIdx * 100) + qIdx;
                        let qNum = globalQIndex + qIdx;
                        let speakSafe = (q.speak || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
                        let opts = Array.isArray(q.o) ? q.o : ["A","B"];
                        let optsHtml = opts.map(o => {
                            const oSafe = o.toString().replace(/\\/g,'\\\\').replace(/'/g,"\\'");
                            return `<div class="opt-btn" onclick="sel(${absIdx}, '${oSafe}', this)">${o}</div>`;
                        }).join('');
                        html += `<div class="card listen-card">
                            <div class="card-header">
                                <span class="q-label">【第 ${qNum} 題】</span> <span class="tag">聽力</span>
                            </div>
                            <div class="listen-play">
                                <button class="listen-btn" onclick="playListen('${speakSafe}')">🔊 播放</button>
                            </div>
                            <div class="q-txt">${q.q}</div>
                            <div class="opts">${optsHtml}</div>
                            <input type="hidden" id="ans-${absIdx}">
                        </div>`;
                    });
                    globalQIndex += pageData.qs.length;
                    pageDiv.innerHTML = html;
                    container.appendChild(pageDiv);
                    return;
                }

                pageData.qs.forEach((q, qIdx) => {
                    let absIdx = (pIdx * 100) + qIdx; // Unique ID for inputs

                    // ★ 閱讀文章顯示 ★
                    if (q._articleTitle && q._articleContent) {
                        html += `<div class="article-box">
                            <div class="article-title">${q._articleTitle}</div>
                            <div class="article-content">${q._articleContent}</div>
                        </div>`;
                    }

                    // ★ 題號標籤修改 ★
                    let label = `<span class="q-label">【第 ${globalQIndex} 題】</span>`;

                    let content = "";
                    if (q.type === 'fill') {
                        let words = q.a.trim().split(/\s+/);
                        if (words.length > 1) {
                            // Multi-word answer: render one input per word
                            content = `<div class="fill-multi">` +
                                words.map((_, wi) =>
                                    `<input type="text" class="fill-input fill-part" id="ans-${absIdx}-${wi}" data-multi="${absIdx}" data-total="${words.length}" oninput="syncFillParts(this)" placeholder="___" style="width:${Math.max(80, words[wi].length * 16)}px">`
                                ).join('<span class="fill-space"> </span>') +
                                `<input type="hidden" id="ans-${absIdx}"></div>`;
                        } else {
                            content = `<input type="text" class="fill-input" id="ans-${absIdx}" placeholder="請作答...">`;
                        }
                    } else {
                        let opts = Array.isArray(q.o) ? q.o : ["A","B","C","D"];
                        content = `<div class="opts">`;
                        opts.forEach(o => {
                            const oSafe = o.toString().replace(/\\/g,'\\\\').replace(/'/g,"\\'");
                            content += `<div class="opt-btn" onclick="sel(${absIdx}, '${oSafe}', this)">${o}</div>`;
                        });
                        content += `</div><input type="hidden" id="ans-${absIdx}">`;
                    }

                    html += `<div class="card">
                            <div class="card-header">
                                ${label} <span class="tag">${q.tag || "綜合"}</span>
                            </div>
                            <div class="q-txt">${q.q}</div>
                            ${content}
                         </div>`;
                    globalQIndex++;
                });
                pageDiv.innerHTML = html;
                container.appendChild(pageDiv);
            });

            document.getElementById('report').style.display = 'none';
            document.getElementById('nav-bar').style.display = 'flex';

            currentPageIdx = 0;
            showPage(0);
        }

        function showPage(idx) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${idx}`).classList.add('active');

            document.getElementById('btn-prev').disabled = (idx === 0);
            let isLast = (idx === questionsByPage.length - 1);
            document.getElementById('btn-next').style.display = isLast ? 'none' : 'block';
            document.getElementById('btn-submit').style.display = isLast ? 'block' : 'none';
            window.scrollTo(0, 0);
        }

        window.changePage = function (delta) {
            currentPageIdx += delta;
            showPage(currentPageIdx);
        };

        window.syncFillParts = function(input) {
            let absIdx = input.dataset.multi;
            let total = parseInt(input.dataset.total);
            let parts = [];
            for (let i = 0; i < total; i++) {
                let el = document.getElementById(`ans-${absIdx}-${i}`);
                parts.push(el ? el.value.trim() : '');
            }
            document.getElementById(`ans-${absIdx}`).value = parts.join(' ');
        };

        function playListen(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            let utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = 0.85;
            window.speechSynthesis.speak(utter);
        }

        let draggedChip = null;

        let _wcSelections = {};  // {absIdx: Set<charIndex>}
        window.toggleWrongChar = function(absIdx, ci) {
            if (!_wcSelections[absIdx]) _wcSelections[absIdx] = new Set();
            let sel = _wcSelections[absIdx];
            if (sel.has(ci)) { sel.delete(ci); }
            else { if (sel.size >= 2) return; sel.add(ci); }
            // Update char highlights
            let sentDiv = document.getElementById('wc-' + absIdx);
            if (sentDiv) {
                sentDiv.querySelectorAll('.wc-char').forEach(span => {
                    span.classList.toggle('selected', sel.has(parseInt(span.dataset.ci)));
                });
            }
            let cntEl = document.getElementById('wc-cnt-' + absIdx);
            if (cntEl) cntEl.textContent = sel.size;
            // Store selected chars as answer
            let chars = [...sel].map(i => {
                let sp = sentDiv ? sentDiv.querySelector('.wc-char[data-ci="' + i + '"]') : null;
                return sp ? sp.textContent : '';
            }).filter(Boolean);
            let ansEl = document.getElementById('ans-' + absIdx);
            if (ansEl) ansEl.value = chars.sort().join(',');
        };

        window.clearMatch = function(dropZone) {
            let prevAnswer = dropZone.dataset.currentAnswer;
            if (!prevAnswer) return;
            document.querySelectorAll('.match-chip').forEach(chip => {
                if (chip.dataset.answer === prevAnswer) {
                    chip.classList.remove('used');
                    chip.style.opacity = '';
                    chip.style.pointerEvents = '';
                }
            });
            dropZone.textContent = '請拖入答案';
            delete dropZone.dataset.currentAnswer;
            dropZone.classList.remove('filled', 'drag-over');
        };

        window.dragStartMatch = function(event) {
            draggedChip = event.target;
            event.dataTransfer.setData('text/plain', event.target.dataset.answer);
            setTimeout(() => { if(draggedChip) draggedChip.style.opacity = '0.5'; }, 0);
        };

        window.dropMatch = function(event, dropZone) {
            event.preventDefault();
            let answer = event.dataTransfer.getData('text/plain');
            if (!answer) return;

            // If this drop zone already had an answer, return chip to pool
            let prevAnswer = dropZone.dataset.currentAnswer;
            if (prevAnswer) {
                document.querySelectorAll('.match-chip').forEach(chip => {
                    if (chip.dataset.answer === prevAnswer) {
                        chip.classList.remove('used');
                        chip.style.opacity = '';
                        chip.style.pointerEvents = '';
                    }
                });
            }

            dropZone.textContent = answer;
            dropZone.dataset.currentAnswer = answer;
            dropZone.classList.add('filled');
            dropZone.classList.remove('drag-over');

            // Mark chip as used
            if (draggedChip) {
                draggedChip.classList.add('used');
                draggedChip.style.opacity = '';
                draggedChip = null;
            } else {
                // Fallback: find by answer value
                document.querySelectorAll('.match-chip').forEach(chip => {
                    if (chip.dataset.answer === answer) chip.classList.add('used');
                });
            }
        };

        window.sel = function (id, val, btn) {
            document.getElementById(`ans-${id}`).value = val;
            Array.from(btn.parentElement.children).forEach(c => c.classList.remove('selected'));
            btn.classList.add('selected');
        };

        function checkAnswer(user, correct) {
            if (!user) return false;
            user = user.toString().trim().toLowerCase();
            correct = correct.toString().toLowerCase();
            if (user === correct) return true;
            if ((correct == 'o' && user == '0') || (correct == 'x' && user == 'x')) return true;
            return false;
        }

        // ---- localStorage helpers ----
        function getStorageKey(suffix) {
            return `quiz_${currentSubject}_g${currentGrade}_${suffix}`;
        }

        function loadHistory() {
            try { return JSON.parse(localStorage.getItem(getStorageKey('history')) || '[]'); } catch(e) { return []; }
        }

        function saveHistory(records) {
            localStorage.setItem(getStorageKey('history'), JSON.stringify(records));
        }

        function loadWrongBank() {
            try { return JSON.parse(localStorage.getItem(getStorageKey('wrongs')) || '[]'); } catch(e) { return []; }
        }

        function saveWrongBank(bank) {
            localStorage.setItem(getStorageKey('wrongs'), JSON.stringify(bank));
        }

        // extra wrong questions injected from wrong bank into current quiz
        let wrongBankInjected = [];

        // ---- Modal ----
        window.openRestartModal = function() {
            let bank = loadWrongBank();
            let btn = document.getElementById('btn-with-wrong');
            let desc = document.getElementById('modal-desc');
            if (bank.length > 0) {
                btn.style.display = 'inline-block';
                desc.textContent = `目前有 ${bank.length} 題待加強題目，請選擇出題方式：`;
            } else {
                btn.style.display = 'none';
                desc.textContent = '請選擇出題方式：';
            }
            document.getElementById('restart-modal').classList.add('open');
        };

        window.closeModal = function() {
            document.getElementById('restart-modal').classList.remove('open');
        };

        window.doRestart = function(includeWrong) {
            closeModal();
            wrongBankInjected = includeWrong ? loadWrongBank() : [];
            initQuiz();
        };

        window.clearHistory = function() {
            if (confirm('確定要清空所有考試紀錄嗎？')) {
                localStorage.removeItem(getStorageKey('history'));
                renderInlineHistory();
            }
        };

        function renderInlineHistory() {
            let records = loadHistory();
            let list = document.getElementById('inline-history-list');
            if (!list) return;
            if (records.length === 0) {
                list.innerHTML = '<span style="color:#bbb;font-size:0.82em;">尚無紀錄</span>';
                return;
            }
            list.innerHTML = [...records].reverse().map(r => {
                let cls = r.score >= 80 ? 'high' : r.score < 60 ? 'low' : '';
                return `<span class="inline-history-item ${cls}">${r.date} ${r.time} 分數=${r.score}分</span>`;
            }).join('');
        }

        const SUBJECT_NAMES = { chinese:'國語', english:'英語', science:'自然', social:'社會', math:'數學' };
        const GRADE_NAMES = ['四上','四下','五上','五下'];

        window.submitQuiz = function () {
            let score = 0;
            let wrongCount = 0;
            let html = "";
            let currentQNum = 1;
            let thisWrongs = [];
            let answeredQIds = new Set();

            questionsByPage.forEach((page, pIdx) => {
                if (page.isMatching) return; // scored separately below
                page.qs.forEach((q, qIdx) => {
                    let absIdx = (pIdx * 100) + qIdx;
                    let el = document.getElementById(`ans-${absIdx}`);
                    let user = el ? el.value : "";

                    let gLink;
                    if (page.isWrongChar) {
                        const gq = encodeURIComponent((q.correct || []).join(' ') + ' ' + (q.exp || ''));
                        gLink = `<a class="google-link" href="https://www.google.com/search?q=${gq}" target="_blank" rel="noopener">🔍 文字</a>`;
                    } else if (q._storyTitle) {
                        // 閱讀測驗題：搜尋文章標題的 YouTube 影片
                        const ytq = encodeURIComponent(q._storyTitle);
                        gLink = `<a class="google-link" href="https://www.youtube.com/results?search_query=${ytq}" target="_blank" rel="noopener">▶ 影片</a>`;
                    } else {
                        let gText;
                        if (q.type === 'fill') {
                            gText = q.q
                                .replace(/_{2,}/g, q.a)
                                .replace(/「[^」]+」/, q.a)
                                .replace(/\([^)]*\)/g, '')
                                .replace(/（[^）]*）/g, '')
                                .trim();
                        } else if (q.a === 'O' || q.a === 'X') {
                            gText = q.q;
                        } else {
                            let m = q.q.match(/「([^」]+)」/);
                            if (m && /^[ㄅ-ㄩˊˇˋ˙]+$/.test(m[1])) {
                                // 注音→國字：重建完整詞語
                                gText = q.q.replace(/「[^」]+」/, q.a).replace(/。?\s*\([^)]*\)/g, '').trim();
                            } else {
                                // MCQ：題目 + 答案一起搜尋，讓 Google 有上下文
                                gText = q.q.replace(/[？?。！!]/g, '').trim() + ' ' + q.a;
                            }
                        }
                        const gq = encodeURIComponent(gText);
                        gLink = `<a class="google-link" href="https://www.google.com/search?q=${gq}" target="_blank" rel="noopener">🔍 文字</a><a class="google-link" href="https://www.google.com/search?q=${gq}&tbm=isch" target="_blank" rel="noopener">🖼️ 圖片</a>`;
                    }

                    let pts = page.pointsPerQ !== undefined ? page.pointsPerQ : 2.5;
                    let isCorrect;
                    if (page.isWrongChar) {
                        // wrongChar: compare selected chars set with q.wrong set
                        let selected = user.split(',').filter(Boolean).sort().join(',');
                        let expected = [...(q.wrong || [])].sort().join(',');
                        isCorrect = selected === expected;
                    } else {
                        isCorrect = checkAnswer(user, q.a);
                    }
                    let qDisplay = page.isWrongChar
                        ? q.sentence.replace(/「/g,'【').replace(/」/g,'】')
                        : q.q;
                    let aDisplay = page.isWrongChar
                        ? (q.wrong || []).join('、') + ' → ' + (q.correct || []).join('、')
                        : q.a;
                    if (isCorrect) {
                        score += pts;
                        html += `<div class="review-item review-correct">
                        <div class="q-txt">【第 ${currentQNum} 題】✔ ${qDisplay}</div>
                        <div class="ans-row"><span class="real-ans">正解：${aDisplay}</span>${gLink}</div>
                        ${q.exp ? `<div class="exp">💡 ${q.exp}</div>` : ''}
                    </div>`;
                        answeredQIds.add(q.q || q.sentence);
                    } else {
                        wrongCount++;
                        let myDisplay = page.isWrongChar ? (user || "(未點選)") : (user || "(未答)");
                        html += `<div class="review-item review-wrong">
                        <div class="q-txt">【第 ${currentQNum} 題】✘ ${qDisplay}</div>
                        <div class="ans-row"><span class="my-ans">您的答案：${myDisplay}</span><span class="real-ans">正解：${aDisplay}</span>${gLink}</div>
                        ${q.exp ? `<div class="exp">💡 ${q.exp}</div>` : ''}
                    </div>`;
                        if (!page.isWrongChar) {
                            thisWrongs.push({ q: q.q, a: q.a, o: q.o || undefined, exp: q.exp || '', tag: q.tag || '' });
                        }
                    }
                    currentQNum++;
                });
            });

            // Score matching questions
            questionsByPage.forEach((pageData) => {
                if (pageData.isMatching) {
                    document.querySelectorAll('.match-drop').forEach(drop => {
                        let correct = drop.dataset.correct;
                        let current = drop.dataset.currentAnswer || '';
                        let termEl = drop.closest('.match-row');
                        let termName = termEl ? termEl.querySelector('.match-term').textContent : '?';
                        if (current === correct) {
                            score += 2.5;
                            currentQNum++;
                            drop.classList.add('correct');
                            drop.classList.remove('wrong');
                            html += `<div class="review-item review-correct">
                                <div class="q-txt">✔ 配合題：${termName} → ${correct}</div>
                                <div class="ans-row"><span class="real-ans">正解：${correct}</span></div>
                            </div>`;
                        } else {
                            wrongCount++;
                            currentQNum++;
                            drop.classList.add('wrong');
                            drop.classList.remove('correct');
                            drop.title = `正確答案：${correct}`;
                            html += `<div class="review-item review-wrong">
                                <div class="q-txt">✘ 配合題：${termName}</div>
                                <div class="ans-row"><span class="my-ans">您的答案：${current || "(未作答)"}</span><span class="real-ans">正解：${correct}</span></div>
                            </div>`;
                            // 配合題不加入錯題庫（無法以選擇題形式再考）
                        }
                    });
                }
            });

            // Update wrong bank: add new wrongs, remove ones answered correctly
            let bank = loadWrongBank();
            // Remove questions answered correctly this round
            bank = bank.filter(b => !answeredQIds.has(b.q));
            // Add new wrongs (avoid duplicates by question text)
            let existingQs = new Set(bank.map(b => b.q));
            thisWrongs.forEach(w => { if (!existingQs.has(w.q)) bank.push(w); });
            saveWrongBank(bank);

            // Save history record
            let now = new Date();
            let dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
            let timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            let records = loadHistory();
            records.push({
                date: dateStr,
                time: timeStr,
                subject: SUBJECT_NAMES[currentSubject] || currentSubject,
                grade: GRADE_NAMES[currentGrade] || '',
                score: score,
                total: currentQNum - 1,
                wrongCount: wrongCount,
                wrongs: thisWrongs
            });
            if (records.length > 50) records = records.slice(-50);
            saveHistory(records);
            renderInlineHistory();

            document.getElementById('score-text').innerText = score + " 分";
            document.getElementById('score-msg').innerText = `共 ${wrongCount} 題錯誤`;
            document.getElementById('score-datetime').innerText = `${dateStr} ${timeStr}`;
            document.getElementById('error-list').innerHTML = html;

            // Show wrong bank banner
            let banner = document.getElementById('wrong-bank-banner');
            if (bank.length > 0) {
                banner.style.display = 'block';
                banner.textContent = `⚠️ 待加強題庫：目前累積 ${bank.length} 題錯誤，下次重新出題可選擇「加入答錯題目」複習。`;
            } else {
                banner.style.display = 'none';
            }

            document.getElementById('quiz-container').innerHTML = '';
            document.getElementById('nav-bar').style.display = 'none';
            document.getElementById('report').style.display = 'block';
            document.getElementById('history-panel')?.classList.remove('open');
            window.scrollTo(0, 0);
        };

        initQuiz();
        renderInlineHistory();
    </script>

</body>
